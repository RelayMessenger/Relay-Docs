# Lint configuration for api-reference/openapi.yaml.
# The spec documents the shipped server contract; rules are disabled only
# where following them would mean documenting behavior the server does not have.
extends:
  - recommended
rules:
  # Webhook payloads and WebSocket frames are referenced from Relay's
  # x-relay-webhooks and x-relay-websocket-frames extensions. Redocly does not
  # count extension references, while the Server reachability pass does.
  no-unused-components: off
