# Lint configuration for api-reference/openapi.yaml.
# The spec documents the shipped server contract; rules are disabled only
# where following them would mean documenting behavior the server does not have.
extends:
  - recommended

rules:
  # /v1/pairings/code/{code} and /v1/pairings/{code}/claim are both shipped
  # routes. They resolve unambiguously: "code" is a literal segment in the
  # first and a parameter in the second, and the router matches literals first.
  no-ambiguous-paths: off

  # GET /v1/agents is the public store listing: no authentication and no
  # validated parameters, so it has no 4xx path. Documenting one would invent
  # behavior. Every other operation documents its real 4xx responses.
  operation-4xx-response: off
