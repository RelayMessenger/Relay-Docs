components:
  schemas:
    AddParticipantRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Phone number (E.164 format) or email address of the participant to add
    Attachment:
      type: object
      required:
        - id
        - filename
        - content_type
        - size_bytes
        - status
        - created_at
      properties:
        id:
          type: string
          description: Unique identifier for the attachment (UUID)
        filename:
          type: string
          description: Original filename of the attachment
        content_type:
          $ref: '#/components/schemas/SupportedContentType'
        size_bytes:
          type: integer
          format: int64
          description: Size of the attachment in bytes
        status:
          type: string
          description: '**DEPRECATED:** This field is deprecated and will be removed in a future API version.'
          deprecated: true
          x-stainless-deprecation-message: status is no longer a useful signal
          enum:
            - pending
            - complete
            - failed
        download_url:
          type: string
          format: uri
          description: URL to download the attachment
        created_at:
          type: string
          format: date-time
          description: When the attachment was created
    Chat:
      type: object
      required:
        - id
        - display_name
        - handles
        - is_archived
        - is_group
        - created_at
        - updated_at
        - health_status
      properties:
        id:
          type: string
          description: Unique identifier for the chat
          format: uuid
        display_name:
          type:
            - string
            - 'null'
          description: Display name for the chat. Defaults to a comma-separated list of recipient handles. Can be updated for group chats.
        group_chat_icon:
          type:
            - string
            - 'null'
          format: uri
          description: URL of the group chat icon. Only set for group chats that have an icon; `null` otherwise.
        service:
          description: Service type for the chat
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ServiceType'
            - type: 'null'
        handles:
          type: array
          description: List of chat participants with full handle details. Always contains at least two handles (your phone number and the other participant).
          items:
