        url:
          type: string
          format: uri
          description: |
            Presigned URL for downloading the attachment (expires in 1 hour).
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type of the file
        size_bytes:
          type: integer
          description: File size in bytes
    schemas-TextPartResponse:
      type: object
      description: A text message part
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - text
          description: Indicates this is a text message part
        value:
          type: string
          description: The text content
        mention:
          type:
            - string
            - 'null'
          description: |
            Handle (E.164 phone number or Apple ID email) of the @mentioned chat participant,
            as sent. `null` when the part carries no mention.
        mention_range:
          type:
            - array
            - 'null'
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: |
            Character range `[start, end)` in `value` highlighted as the mention, as sent.
            `null` when the send omitted it (the whole `value` is highlighted) or the part
            carries no mention.
            *Characters are measured as UTF-16 code units. Most characters count as 1; some emoji count as 2.*
