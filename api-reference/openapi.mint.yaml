      properties:
        subscriptions:
          type: array
          description: List of webhook subscriptions
          items:
            $ref: '#/components/schemas/WebhookSubscriptionResponse'
    MediaPart:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        url:
          type: string
          format: uri
          description: |
            Any publicly accessible HTTPS URL to the media file. The server downloads and
            sends the file automatically — no pre-upload step required.

            **Size limit:** 10MB maximum for URL-based downloads. For larger files (up to 100MB),
            use the pre-upload flow: `POST /v3/attachments` to get a presigned URL, upload directly,
            then reference by `attachment_id`.

            **Requirements:**
            - URL must use HTTPS
            - File content must be a supported format (the server validates the actual file content)

            **Supported formats:**
            - Images: .jpg, .jpeg, .png, .gif, .heic, .heif, .tif, .tiff, .bmp
            - Videos: .mp4, .mov, .m4v, .mpeg, .mpg, .3gp
            - Audio: .m4a, .mp3, .aac, .caf, .wav, .aiff, .amr
            - Documents: .pdf, .txt, .rtf, .csv, .doc, .docx, .xls, .xlsx, .ppt, .pptx, .pages, .numbers, .key, .epub, .zip, .html, .htm
            - Contact & Calendar: .vcf, .ics

            **Tip:** Audio sent here appears as a regular file attachment. To send audio as an
            iMessage voice memo bubble (with inline playback), use `/v3/chats/{chatId}/voicememo`.
            For repeated sends of the same file, use `attachment_id` to avoid redundant downloads.

            Either `url` or `attachment_id` must be provided, but not both.
          pattern: ^https://
        attachment_id:
          type: string
          format: uuid
          description: |
            Reference to a file pre-uploaded via `POST /v3/attachments` (optional).
            The file is already stored, so sends using this ID skip the download step —
            useful when sending the same file to many recipients.

            Either `url` or `attachment_id` must be provided, but not both.
    MediaPartResponse:
      type: object
      description: A media attachment part
      required:
        - type
        - id
        - url
        - filename
        - mime_type
        - size_bytes
        - reactions
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        id:
          type: string
          format: uuid
          description: Unique attachment identifier
        url:
          type: string
          format: uri
          description: |
            Presigned URL for downloading the attachment (expires in 1 hour).
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type of the file
        size_bytes:
          type: integer
          description: File size in bytes
        reactions:
          type:
            - array
            - 'null'
          description: Reactions on this message part
          items:
            $ref: '#/components/schemas/Reaction'
    Message:
      type: object
      required:
        - id
        - chat_id
        - is_from_me
        - is_delivered
        - is_read
        - delivery_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the message
          format: uuid
        chat_id:
          type: string
          description: ID of the chat this message belongs to
          format: uuid
        service:
          description: Service used to send/receive this message
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ServiceType'
            - type: 'null'
        from:
          type:
            - string
            - 'null'
          description: 'DEPRECATED: Use from_handle instead. Phone number of the message sender.'
          deprecated: true
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ChatHandle'
            - type: 'null'
        parts:
          type:
            - array
            - 'null'
          description: Message parts in order (text, media, and link)
          items:
            oneOf:
              - $ref: '#/components/schemas/TextPartResponse'
              - $ref: '#/components/schemas/MediaPartResponse'
              - $ref: '#/components/schemas/LinkPartResponse'
        reply_to:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ReplyTo'
            - type: 'null'
        is_from_me:
          type: boolean
          description: Whether this message was sent by the authenticated user
        is_delivered:
          type: boolean
          deprecated: true
          description: 'DEPRECATED: Use `delivery_status` instead (true when `delivery_status` is `delivered` or `read`). Whether the message has been delivered.'
        is_read:
          type: boolean
          deprecated: true
          description: 'DEPRECATED: Use `delivery_status == "read"` instead. Whether the message has been read.'
        delivery_status:
          $ref: '#/components/schemas/DeliveryStatus'
        created_at:
          type: string
          format: date-time
          description: When the message was created
        updated_at:
          type: string
          format: date-time
          description: When the message was last updated
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was sent
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was delivered
        read_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was read
        reconciled_at:
          type: string
          format: date-time
          description: Present only when this message was recovered by reconciliation rather than delivered live, and set to the time of that recovery. The field is omitted entirely for normally-delivered messages, which is the overwhelming majority. When present, expect `sent_at` to be substantially earlier — the message is genuine but was ingested late, so it may not have appeared in earlier reads of this conversation.
    MessageContent:
      type: object
      description: |
        Message content container. Groups all message-related fields together,
        separating the "what" (message content) from the "where" (routing fields like from/to).

        A message carries EITHER `parts` — text and attachments, which compose
        into one bubble — or a single `experience` invocation, which renders an
        experience inside Linq's iMessage app. Never both: an app card is the whole message
        (Apple's `MSMessage` cannot coexist with text), so copy and a card are
        two sends, not one.
      oneOf:
        - required:
            - parts
      properties:
        parts:
          x-go-type-skip-optional-pointer: true
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/MessagePart'
        reply_to:
          $ref: '#/components/schemas/ReplyTo'
          description: Reply to another message to create a threaded conversation
        idempotency_key:
          type: string
          description: |
            Optional idempotency key for this message.
            Use this to prevent duplicate sends of the same message. Reusing a key
            whose message was deleted — or was an ephemeral message that has since
            expired — returns 404; the message is never resent.
          maxLength: 255
    MessageDeliveredEvent:
      description: Payload for message.delivered webhook events (2025-01-01 format). Extends MessageEvent with delivered_at and message_id.
      allOf:
        - $ref: '#/components/schemas/MessageEvent'
        - type: object
          required:
            - delivered_at
          properties:
            message_id:
              type: string
              description: Message identifier (UUID)
            delivered_at:
              type: string
              format: date-time
              description: When the message was delivered to the recipient's device
    MessageDeliveredWebhook:
      description: Complete webhook payload for message.delivered events (2025-01-01 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageDeliveredEvent'
    MessageDeliveredWebhookV2:
      description: Complete webhook payload for message.delivered events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    MessageEvent:
      type: object
      description: Unified payload for message.sent and message.received webhook events (2025-01-01 format)
      properties:
        chat_id:
          type: string
          format: uuid
          description: Chat identifier
        is_group:
          type: boolean
          description: Whether this is a group chat
        idempotency_key:
          type:
            - string
            - 'null'
          description: Idempotency key for the message. Used for deduplication of outbound messages.
        from:
          type: string
          description: 'DEPRECATED: Use from_handle instead. Phone number or email address of the message sender.'
          deprecated: true
        from_handle:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The sender of this message as a full handle object
        message:
          $ref: '#/components/schemas/MessagePayload'
        recipient_phone:
          type:
            - string
            - 'null'
          description: 'DEPRECATED: Use recipient_handle instead. Our phone number that received the message. Null for sent events.'
          deprecated: true
        recipient_handle:
          description: Our phone number that received the message as a full handle object. Null for sent events.
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ChatHandle'
            - type: 'null'
        is_from_me:
          type: boolean
          description: Whether the message was sent by us (true for sent events, false for received events)
        received_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was received. Null for sent events.
        service:
          description: The service used to send/receive the message
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ServiceType'
            - type: 'null'
    MessageEventV2:
      type: object
      description: |
        Unified payload for message webhooks when using `webhook_version: "2026-02-03"`.

        This schema is used for message.sent, message.received, message.delivered, and message.read
        events when the subscription URL includes `?version=2026-02-03`.

        Key differences from V1 (2025-01-01):
        - `direction`: "inbound" or "outbound" instead of `is_from_me` boolean
        - `sender_handle`: Full handle object for the sender
        - `chat`: Nested object with `id`, `is_group`, and `owner_handle`
        - Message fields (`id`, `parts`, `effect`, etc.) are at the top level, not nested in `message`

        Timestamps indicate the message state:
        - `message.sent`: sent_at set, delivered_at=null, read_at=null
        - `message.received`: sent_at set, delivered_at=null, read_at=null
        - `message.delivered`: sent_at set, delivered_at set, read_at=null
        - `message.read`: sent_at set, delivered_at set, read_at set
      required:
        - chat
        - id
        - direction
        - sender_handle
        - service
        - parts
      properties:
        chat:
          type: object
          description: Chat information
          required:
            - id
            - health_status
          properties:
            id:
              type: string
              format: uuid
              description: Chat identifier
            is_group:
              type:
                - boolean
                - 'null'
              description: Whether this is a group chat
            owner_handle:
              description: Your phone number's handle. Always has is_me=true.
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/ChatHandle'
                - type: 'null'
            health_status:
              $ref: '#/components/schemas/HealthStatus'
        id:
          type: string
          format: uuid
          description: Message identifier
        idempotency_key:
          type:
            - string
            - 'null'
          description: Idempotency key for deduplication of outbound messages.
        direction:
          type: string
          description: Message direction - "outbound" if sent by you, "inbound" if received
          enum:
            - inbound
            - outbound
        sender_handle:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The handle that sent this message
        parts:
          type: array
          description: Message parts (text and/or media)
          items:
            oneOf:
              - $ref: '#/components/schemas/schemas-TextPartResponse'
              - $ref: '#/components/schemas/schemas-MediaPartResponse'
              - $ref: '#/components/schemas/schemas-LinkPartResponse'
            discriminator:
              propertyName: type
              mapping:
                text: '#/components/schemas/schemas-TextPartResponse'
                media: '#/components/schemas/schemas-MediaPartResponse'
                link: '#/components/schemas/schemas-LinkPartResponse'
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was sent. Null if not yet sent.
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was delivered. Null if not yet delivered.
        read_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was read. Null if not yet read.
        reconciled_at:
          type: string
          format: date-time
          description: 'Present only when this message was recovered by reconciliation rather than delivered live, and set to the time of that recovery. The field is omitted entirely for normally-delivered messages, which is the overwhelming majority. When present, expect `sent_at` to be substantially earlier than delivery of this event: the message is genuine but is arriving late and out of real-time order, so treat it as history rather than as a live inbound (for example, suppress auto-replies).'
        reply_to:
          type:
            - object
            - 'null'
          description: Reference to the message this is replying to (for threaded replies)
          properties:
            message_id:
              type: string
              format: uuid
              description: ID of the message being replied to
            part_index:
              type: integer
              format: int32
              minimum: 0
              description: Index of the part being replied to
        service:
          allOf:
            - $ref: '#/components/schemas/ServiceType'
          description: The service used to send/receive the message
    MessageFailedEvent:
      type: object
      description: |
        Error details for message.failed webhook events.
        See [WebhookErrorCode](#/components/schemas/WebhookErrorCode) for the full error code reference.

        In rare cases the message can still be delivered after this event fires — a `message.delivered` webhook for the same message ID may follow.
      required:
        - code
        - failed_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID)
        message_id:
          type: string
          description: Message identifier (UUID)
        code:
          $ref: '#/components/schemas/WebhookErrorCode'
        reason:
          type: string
          description: Human-readable description of the failure
        detail_code:
          type:
            - integer
            - 'null'
          description: |
            Opaque diagnostic code identifying the specific failure class within `code`.
            Values are not enumerated and may change without notice — log it and include
            it in support requests, but do not branch on it.
        service:
          description: The service the message was being sent over when it failed. Null when the transport could not be determined.
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ServiceType'
            - type: 'null'
        failed_at:
          type: string
          format: date-time
          description: When the failure was detected
    MessageFailedWebhook:
      description: Complete webhook payload for message.failed events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageFailedEvent'
    MessagePart:
      type: object
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextPart'
          media: '#/components/schemas/MediaPart'
          link: '#/components/schemas/LinkPart'
      oneOf:
        - $ref: '#/components/schemas/TextPart'
        - $ref: '#/components/schemas/MediaPart'
        - $ref: '#/components/schemas/LinkPart'
    MessagePayload:
      type: object
      description: Message content nested within webhook events
      properties:
        id:
          type: string
          format: uuid
          description: Message identifier
        parts:
          type: array
          description: Message content parts (text and/or media)
          items:
            oneOf:
              - $ref: '#/components/schemas/schemas-TextPartResponse'
              - $ref: '#/components/schemas/schemas-MediaPartResponse'
              - $ref: '#/components/schemas/schemas-LinkPartResponse'
        reply_to:
          type: object
          description: Reference to the message this is replying to
          properties:
            message_id:
              type: string
              format: uuid
              description: The ID of the message being replied to
            part_index:
              type: integer
              format: int32
              minimum: 0
              description: Index of the message part being replied to (0-based)
        is_delivered:
          type: boolean
          description: Whether the message has been delivered
        is_read:
          type: boolean
          description: Whether the message has been read
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was sent
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was delivered
        read_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was read
        created_at:
          type: string
          format: date-time
          description: When the message record was created
        updated_at:
          type: string
          format: date-time
          description: When the message record was last updated
        reconciled_at:
          type: string
          format: date-time
          description: 'Present only when this message was recovered by reconciliation rather than delivered live, and set to the time of that recovery. The field is omitted entirely for normally-delivered messages, which is the overwhelming majority. When present, expect `sent_at` to be substantially earlier than delivery of this event: the message is genuine but is arriving late and out of real-time order, so treat it as history rather than as a live inbound (for example, suppress auto-replies).'
    MessageReadEvent:
      description: Payload for message.read webhook events (2025-01-01 format). Extends MessageEvent with read_at and message_id.
      allOf:
        - $ref: '#/components/schemas/MessageEvent'
        - type: object
          required:
            - read_at
          properties:
            message_id:
              type: string
              description: Message identifier (UUID)
            read_at:
              type: string
              format: date-time
              description: When the message was read
    MessageReadWebhook:
      description: Complete webhook payload for message.read events (2025-01-01 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageReadEvent'
    MessageReadWebhookV2:
      description: Complete webhook payload for message.read events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    MessageReceivedWebhook:
      description: Complete webhook payload for message.received events (2025-01-01 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEvent'
    MessageReceivedWebhookV2:
      description: Complete webhook payload for message.received events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    MessageSentWebhook:
      description: Complete webhook payload for message.sent events (2025-01-01 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEvent'
    MessageSentWebhookV2:
      description: Complete webhook payload for message.sent events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    ParticipantAddedEvent:
      type: object
      description: Payload for participant.added webhook events
      required:
        - handle
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        handle:
          type: string
          description: 'DEPRECATED: Use participant instead. Handle (phone number or email address) of the added participant.'
          deprecated: true
        participant:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The added participant as a full handle object
        added_at:
          type: string
          format: date-time
          description: When the participant was added
    ParticipantAddedWebhook:
      description: Complete webhook payload for participant.added events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ParticipantAddedEvent'
    ParticipantRemovedEvent:
      type: object
      description: Payload for participant.removed webhook events
      required:
        - handle
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        handle:
          type: string
          description: 'DEPRECATED: Use participant instead. Handle (phone number or email address) of the removed participant.'
          deprecated: true
        participant:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The removed participant as a full handle object
        removed_at:
          type: string
          format: date-time
          description: When the participant was removed
    ParticipantRemovedWebhook:
      description: Complete webhook payload for participant.removed events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ParticipantRemovedEvent'
    Reaction:
      type: object
      required:
        - is_me
        - handle
        - type
      properties:
        is_me:
          type: boolean
          description: Whether this reaction is from the current user
        handle:
          $ref: '#/components/schemas/ChatHandle'
        type:
          $ref: '#/components/schemas/ReactionType'
        custom_emoji:
          type:
            - string
            - 'null'
          description: Custom emoji if type is "custom", null otherwise
        sticker:
          type:
            - object
            - 'null'
          description: Sticker attachment details when reaction_type is "sticker". Null for non-sticker reactions.
          properties:
            url:
              type: string
              format: uri
              description: |
                Presigned URL for downloading the sticker image (expires in 1 hour).
            mime_type:
              type: string
              description: MIME type of the sticker image
            width:
              type: integer
              description: Sticker image width in pixels
            height:
              type: integer
              description: Sticker image height in pixels
            file_name:
              type: string
              description: Filename of the sticker
    ReactionAddedEvent:
      description: Payload for reaction.added webhook events
      allOf:
        - $ref: '#/components/schemas/ReactionEventBase'
    ReactionAddedWebhook:
      description: Complete webhook payload for reaction.added events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReactionAddedEvent'
    ReactionEventBase:
      type: object
      required:
        - reaction_type
        - is_from_me
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID)
        from:
          type: string
          description: 'DEPRECATED: Use from_handle instead. Phone number or email address of the person who added/removed the reaction.'
          deprecated: true
        from_handle:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The person who added/removed the reaction as a full handle object
        message_id:
          type: string
          description: Message identifier (UUID) that the reaction was added to or removed from
        part_index:
          type: integer
          format: int32
          minimum: 0
          description: Index of the message part that was reacted to (0-based)
        reaction_type:
          $ref: '#/components/schemas/ReactionType'
        custom_emoji:
          type:
            - string
            - 'null'
          description: The actual emoji when reaction_type is "custom". Null for standard tapbacks.
        is_from_me:
          type: boolean
          description: Whether this reaction was from the owner of the phone number (true) or from someone else (false)
        service:
          allOf:
            - $ref: '#/components/schemas/ServiceType'
          description: Message service type
        reacted_at:
          type: string
          format: date-time
          description: When the reaction was added or removed
        sticker:
          type:
            - object
            - 'null'
          description: Sticker attachment details when reaction_type is "sticker". Null for non-sticker reactions.
          properties:
            url:
              type: string
              format: uri
              description: |
                Presigned URL for downloading the sticker image (expires in 1 hour).
            mime_type:
              type: string
              description: MIME type of the sticker image
            width:
              type: integer
              description: Sticker image width in pixels
            height:
              type: integer
              description: Sticker image height in pixels
            file_name:
              type: string
              description: Filename of the sticker
    ReactionRemovedEvent:
      description: Payload for reaction.removed webhook events
      allOf:
        - $ref: '#/components/schemas/ReactionEventBase'
    ReactionRemovedWebhook:
      description: Complete webhook payload for reaction.removed events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReactionRemovedEvent'
    ReactionType:
      type: string
      description: |
        Type of reaction. Standard iMessage tapbacks are love, like, dislike, laugh, emphasize, question.
        Custom emoji reactions have type "custom" with the actual emoji in the custom_emoji field.
        Sticker reactions have type "sticker" with sticker attachment details in the sticker field.
      enum:
        - love
        - like
        - dislike
        - laugh
        - emphasize
        - question
        - custom
        - sticker
    RemoveParticipantRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Phone number (E.164 format) or email address of the participant to remove
    ReplyTo:
      type: object
      description: Indicates this message is a threaded reply to another message
      required:
        - message_id
      properties:
        message_id:
          type: string
          format: uuid
          description: The ID of the message to reply to
        part_index:
          type: integer
          format: int32
          description: |
            The specific message part to reply to (0-based index).
            Defaults to 0 (first part) if not provided.
            Use this when replying to a specific part of a multipart message.
          minimum: 0
    RequestUploadRequest:
      type: object
      required:
        - filename
        - content_type
        - size_bytes
      properties:
        filename:
          type: string
          description: Name of the file to upload
          minLength: 1
          maxLength: 255
        content_type:
          $ref: '#/components/schemas/SupportedContentType'
        size_bytes:
          type: integer
          format: int64
          description: Size of the file in bytes (max 100MB)
          minimum: 1
          maximum: 104857600
    RequestUploadResult:
      type: object
      required:
        - attachment_id
        - upload_url
        - download_url
        - http_method
        - expires_at
        - required_headers
      properties:
        attachment_id:
          type: string
          description: Unique identifier for the attachment
          format: uuid
        upload_url:
          type: string
          format: uri
          description: |
            Presigned URL for uploading the file. PUT the raw binary file content to this URL
            with the `required_headers`. Do not JSON-encode or multipart-wrap the body.
            Expires after 15 minutes. Treat the URL as opaque — the hostname depends on
            partner configuration and is the same across sandbox and production.
        download_url:
          type: string
          format: uri
          description: |
            Permanent CDN URL for the file. Does not expire. Use the `attachment_id`
            to reference this file in media parts when sending messages.
        http_method:
          type: string
          description: HTTP method to use for upload (always PUT)
          enum:
            - PUT
        expires_at:
          type: string
          format: date-time
          description: When the upload URL expires (15 minutes from now)
        required_headers:
          type: object
          description: |
            HTTP headers that must be set on the upload request. The presigned URL is signed
            with these exact values — S3 will reject the upload if they don't match.
          additionalProperties:
            type: string
    SendMessageRequest:
      type: object
      description: |
        Send a message with an auto-selected from-number. The recipient set (`to`)
        is the chat identity; the platform resolves the line and target chat.
      required:
        - to
        - message
      properties:
        to:
          type: array
          description: |
            Recipient handles (E.164 phone numbers or email addresses). One handle
            is a direct chat; multiple handles a group chat. Order-independent — the
            set identifies the chat.
          minItems: 1
          maxItems: 31
          items:
            type: string
        exclude_from:
          type: array
          description: |
            Lines (E.164) not to pick for this send. Applies for this request
            only — nothing is remembered between calls.

            **Exclusion only affects picking a line for a new chat.** If `to`
            already has a chat, that chat is reused on its own line, and a chat on
            a non-excluded line is preferred when there is more than one. If the
            only chat these recipients have is on an excluded line, it is still
            reused — an exclusion never abandons a live chat or moves it to a new
            number. Check `from` in the response to see the line that was actually
            used.

            Numbers that are not your lines are ignored. Every entry must be
            E.164 — a value like `4155551234` is rejected rather than silently
            skipped. Excluding every one of your available lines returns 400 when
            a line has to be picked.
          maxItems: 100
          items:
            type: string
        message:
          allOf:
            - $ref: '#/components/schemas/MessageContent'
          description: |
            The message to send. Text, media, and attachment parts are all
            supported. **Unlike `POST /v3/chats`, a link is allowed even as the
            first message of a newly created chat** — but a link as the very first
            message on a freshly selected line can elevate that line's flagging
            risk. Voice memos are not supported here; use
            `POST /v3/chats/{chatId}/voicememo`.
        continuation_message:
          allOf:
            - $ref: '#/components/schemas/ContinuationMessage'
          description: |
            Optional text-only fallback. When the send fails over to a new line
            (the prior chat's line was flagged), this text is sent as the single
            message INSTEAD of `message`. Ignored on reuse or genuine first contact.
            Exactly one message is ever sent.
    SendMessageResponse:
      type: object
      description: Response for sending a message to a chat
      required:
        - chat_id
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: Unique identifier of the chat this message was sent to
        message:
          $ref: '#/components/schemas/SentMessage'
    SendMessageResult:
      type: object
      description: |
        Result of an auto-from send. Self-describing: which line was used, which
        chat the message landed in, whether a new chat was created, and the
        resulting message id(s).
      required:
        - chat_id
        - created_new_chat
        - from
        - from_selection
        - is_group
        - service
        - handles
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: The resolved chat (reused or newly created) the message landed in.
        created_new_chat:
          type: boolean
          description: True when a new chat was created (new or failover), false on reuse.
        from:
          type: string
          description: The line (E.164) the message was actually sent from.
        from_selection:
          type: object
          description: Why this line/chat was chosen.
          required:
            - reason
            - reused_existing_chat
          properties:
            reason:
              type: string
              description: |
                - `reused_active_chat` — reused an existing chat on its healthy line
                - `new_best_number` — created a new chat on the best available line
                - `failover_flagged` — no existing chat for these recipients was on
                  a line that could send; created a new chat on a fresh line
              enum:
                - reused_active_chat
                - new_best_number
                - failover_flagged
            reused_existing_chat:
              type: boolean
              description: True only when an existing chat was reused.
        is_group:
          type: boolean
          description: Whether the resolved chat is a group chat.
        service:
          allOf:
            - $ref: '#/components/schemas/ServiceType'
          description: Messaging service of the resolved chat.
        handles:
          type: array
          description: Participants of the resolved chat.
          items:
            $ref: '#/components/schemas/ChatHandle'
        message:
          allOf:
            - $ref: '#/components/schemas/SentMessage'
          description: The primary message that was sent.
        previous_chat_id:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Set ONLY on `failover_flagged`: the abandoned flagged chat that was NOT
            sent into. Null otherwise.
    SendMessageToChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/MessageContent'
    SendReactionRequest:
      type: object
      required:
        - operation
        - type
      properties:
        operation:
          type: string
          description: Whether to add or remove the reaction
          enum:
            - add
            - remove
        type:
          $ref: '#/components/schemas/ReactionType'
        custom_emoji:
          type: string
          description: |
            Custom emoji string. Required when type is "custom".
        part_index:
          type: integer
          description: |
            Optional index of the message part to react to.
            If not provided, reacts to the entire message (part 0).
      if:
        properties:
          type:
            const: custom
      then:
        required:
          - custom_emoji
    SendVoiceMemoToChatRequest:
      type: object
      description: |
        Request to send a voice memo to a chat (chat_id provided in path).
        Exactly one of `voice_memo_url` or `attachment_id` must be provided.
      properties:
        voice_memo_url:
          type: string
          format: uri
          description: |
            URL of the voice memo audio file. Must be a publicly accessible HTTPS URL.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
        attachment_id:
          type: string
          format: uuid
          description: |
            Reference to a voice memo file pre-uploaded via `POST /v3/attachments`.
            The file is already stored, so sends using this ID skip the download step.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
      oneOf:
        - required:
            - voice_memo_url
          not:
            required:
              - attachment_id
        - required:
            - attachment_id
          not:
            required:
              - voice_memo_url
    SendVoiceMemoToChatResult:
      type: object
      description: Response for sending a voice memo to a chat
      required:
        - voice_memo
      properties:
        voice_memo:
          type: object
          required:
            - id
            - from
            - to
            - status
            - voice_memo
            - created_at
            - chat
          properties:
            id:
              type: string
              format: uuid
              description: Message identifier
            from:
              type: string
              description: Sender phone number
            to:
              type: array
              items:
                type: string
              description: Recipient handles (phone numbers or email addresses)
            status:
              type: string
              description: Current delivery status
            service:
              description: Service used to send this voice memo
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/ServiceType'
                - type: 'null'
            voice_memo:
              $ref: '#/components/schemas/VoiceMemoAttachment'
            created_at:
              type: string
              format: date-time
              description: When the voice memo was created
            chat:
              $ref: '#/components/schemas/ChatInfo'
    SentMessage:
