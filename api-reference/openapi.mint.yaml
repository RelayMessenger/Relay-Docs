    ContinuationMessage:
      type: object
      description: |
        Text-only fallback that **replaces** `message` ONLY on the failover branch —
        when a chat with these recipients already existed but its line was flagged,
        so a new chat is created on a fresh line. On that branch this text is sent as
        the single message instead of `message` (the recipient is on a new number, so
        you typically want a fresh-number-appropriate opener rather than the original
        content). Ignored otherwise (a healthy reuse, or genuine first contact).
        Carries no parts, media, or effects — exactly one message is ever sent.
      required:
        - text
      properties:
        text:
          type: string
          description: The replacement message text, sent as the single message on failover.
          minLength: 1
          maxLength: 10000
    CreateChatRequest:
      type: object
      required:
        - from
        - to
        - message
      properties:
        from:
          type: string
          description: |
            Sender phone number in E.164 format. Must be a phone number that the
            authenticated partner has permission to send from.
          pattern: ^\+[1-9][0-9]{1,14}$
        to:
          type: array
          description: |
            Array of recipient handles (phone numbers in E.164 format or email addresses).
            For individual chats, provide one recipient. For group chats, provide multiple.
          minItems: 1
          maxItems: 31
          items:
            type: string
        message:
          allOf:
            - $ref: '#/components/schemas/MessageContent'
          description: |
            Initial message for the new chat.

            **First outbound message link restriction:** The initial message cannot be a link. A
            request is rejected with `400` (error code `1005`) if it includes a `link`
            part or any `text` part containing a URL. Follow-up messages via
            `POST /v3/chats/{chatId}/messages` may contain links.
