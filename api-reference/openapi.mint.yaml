components:
  schemas:
    AddParticipantRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Relay Handle.
    AgentContact:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - displayName
        - tagline
        - avatarUrl
        - accentColor
        - capabilities
        - installation
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        tagline:
          type: string
        avatarUrl:
          type:
            - string
            - 'null'
          format: uri
        accentColor:
          type:
            - string
            - 'null'
        capabilities:
          type: array
          items:
            type: string
        installation:
          oneOf:
            - $ref: '#/components/schemas/ContactInstallation'
            - type: 'null'
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
    Attachment:
      type: object
      required:
        - id
        - filename
        - content_type
        - size_bytes
        - status
        - created_at
      properties:
        id:
          type: string
          description: Unique identifier for the attachment (UUID)
        filename:
          type: string
          description: Original filename of the attachment
        content_type:
          $ref: '#/components/schemas/SupportedContentType'
        size_bytes:
          type: integer
          format: int64
          description: Size of the attachment in bytes
        status:
          type: string
          description: '**DEPRECATED:** This field is deprecated and will be removed in a future API version.'
          deprecated: true
          x-stainless-deprecation-message: status is no longer a useful signal
          enum:
            - pending
            - complete
            - failed
        download_url:
          type: string
          format: uri
          description: URL to download the attachment
        created_at:
          type: string
          format: date-time
          description: When the attachment was created
        duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Audio or video duration in milliseconds when known.
        width:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Pixel width when known. Width and height are supplied together.
        height:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Pixel height when known. Width and height are supplied together.
    BlockHandleRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Registered Relay Handle.
        reason:
          type: string
          description: Optional free-text note on why the handle was blocked
    BlockedHandleEntry:
      type: object
      required:
        - handle
        - blocked_at
      properties:
        handle:
          type: string
          description: Registered Relay Handle blocked by the authenticated Contact.
        reason:
          type: string
          description: Optional note recorded when the handle was blocked
        blocked_at:
          type: string
          format: date-time
          description: When the handle was blocked
    BlockedHandleResult:
      type: object
      required:
        - blocked_handle
      properties:
        blocked_handle:
          $ref: '#/components/schemas/BlockedHandleEntry'
    Chat:
      type: object
      required:
        - id
        - display_name
        - handles
        - is_group
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the chat
          format: uuid
        display_name:
          type:
            - string
            - 'null'
          description: Display name for the chat. Defaults to a comma-separated list of recipient handles. Can be updated for group chats.
        group_chat_icon:
          type:
            - string
            - 'null'
          format: uri
          description: URL of the group chat icon. Only set for group chats that have an icon; `null` otherwise.
        handles:
          type: array
          items:
            $ref: '#/components/schemas/ChatHandle'
        is_group:
          type: boolean
          description: Whether this is a group chat
          default: false
        created_at:
          type: string
          format: date-time
          description: When the chat was created
        updated_at:
          type: string
          format: date-time
          description: When the chat was last updated
    ChatCreatedEvent:
      type: object
      required:
        - id
        - display_name
        - handles
        - is_group
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the chat
          format: uuid
        display_name:
          type:
            - string
            - 'null'
          description: Display name for the chat. Defaults to a comma-separated list of recipient handles. Can be updated for group chats.
        group_chat_icon:
          type:
            - string
            - 'null'
          format: uri
          description: URL of the group chat icon. Only set for group chats that have an icon; `null` otherwise.
        handles:
          type: array
          items:
            $ref: '#/components/schemas/ChatHandle'
        is_group:
          type: boolean
          description: Whether this is a group chat
          default: false
        created_at:
          type: string
          format: date-time
          description: When the chat was created
        updated_at:
          type: string
          format: date-time
          description: When the chat was last updated
      description: Chat resource created for the receiving agent.
    ChatCreatedWebhook:
      description: Complete webhook payload for chat.created events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ChatCreatedEvent'
    ChatGroupIconUpdatedEvent:
      type: object
      description: Payload for chat.group_icon_updated webhook events
      required:
        - chat_id
        - updated_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        old_value:
          type:
            - string
            - 'null'
          description: Previous icon URL (null if no previous icon)
        new_value:
          type:
            - string
            - 'null'
          description: New icon URL (null if the icon was removed)
        changed_by_handle:
          description: The handle who made the change.
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ChatHandle'
            - type: 'null'
        updated_at:
          type: string
          format: date-time
          description: When the update occurred
    ChatGroupIconUpdatedWebhook:
      description: Complete webhook payload for chat.group_icon_updated events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ChatGroupIconUpdatedEvent'
    ChatGroupNameUpdatedEvent:
      type: object
      description: Payload for chat.group_name_updated webhook events
      required:
        - chat_id
        - updated_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        old_value:
          type:
            - string
            - 'null'
          description: Previous group name (null if no previous name)
        new_value:
          type:
            - string
            - 'null'
          description: New group name (null if the name was removed)
        changed_by_handle:
          description: The handle who made the change.
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ChatHandle'
            - type: 'null'
        updated_at:
          type: string
          format: date-time
          description: When the update occurred
    ChatGroupNameUpdatedWebhook:
      description: Complete webhook payload for chat.group_name_updated events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ChatGroupNameUpdatedEvent'
    ChatHandle:
      type: object
      required:
        - id
        - handle
        - joined_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this handle
        handle:
          type: string
          description: Relay Handle.
        status:
          type:
            - string
            - 'null'
          description: Participant status
          enum:
            - active
            - left
            - removed
          default: active
        joined_at:
          type: string
          format: date-time
          description: When this participant joined the chat
        left_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When they left (if applicable)
        is_me:
          type:
            - boolean
            - 'null'
          description: Whether this handle is the authenticated caller.
        kind:
          type: string
          enum:
            - user
            - agent
          description: Relay handle kind. Better Auth owns users; WorkOS owns agent organizations.
        display_name:
          type:
            - string
            - 'null'
          description: Profile projection from the identity provider; not stored in the message database.
        avatar_url:
          type:
            - string
            - 'null'
          format: uri
          description: Avatar projection from the identity provider; not stored in the message database.
    ChatInfo:
      type: object
      required:
        - id
        - handles
        - is_group
      properties:
        id:
          type: string
          format: uuid
          description: Chat identifier
        handles:
          type: array
          description: Chat participants
          items:
            $ref: '#/components/schemas/ChatHandle'
        is_group:
          type: boolean
          description: Whether this is a group chat
    ContactCardItem:
      type: object
      required:
        - handle
        - first_name
        - is_active
      properties:
        first_name:
          type: string
        last_name:
          type: string
        image_url:
          type: string
        is_active:
          type: boolean
        handle:
          type: string
          description: Relay Handle associated with this contact card.
    ContactInstallation:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - source
        - conversationId
        - canRemove
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - active
        source:
          type: string
          enum:
            - exact_handle
            - share_link
        conversationId:
          type: string
          format: uuid
        canRemove:
          type: boolean
    CreateChatRequest:
      type: object
      required:
        - from
        - to
        - message
      properties:
        from:
          type: string
          description: Authenticated sender's Relay Handle.
          pattern: ^\+[1-9][0-9]{1,14}$
        to:
          type: array
          minItems: 1
          maxItems: 31
          items:
            type: string
        message:
          allOf:
            - $ref: '#/components/schemas/MessageContent'
          description: |
            Initial message for the new chat.

            **First outbound message link restriction:** The initial message cannot be a link. A
            request is rejected with `400` (error code `1005`) if it includes a `link`
            part or any `text` part containing a URL. Follow-up messages via
            `POST /v1/chats/{chatId}/messages` may contain links.
    CreateChatResult:
      type: object
      description: Response for creating a new chat with an initial message
      required:
        - chat
      properties:
        chat:
          type: object
          required:
            - id
            - display_name
            - is_group
            - handles
            - message
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier for the created chat (UUID)
            display_name:
              type:
                - string
                - 'null'
              description: Display name for the chat. Defaults to a comma-separated list of recipient handles. Can be updated for group chats.
            is_group:
              type: boolean
              description: Whether this is a group chat
            handles:
              type: array
              items:
                $ref: '#/components/schemas/ChatHandle'
            message:
              $ref: '#/components/schemas/SentMessage'
    CreateWebhookSubscriptionRequest:
      type: object
      required:
        - target_url
        - subscribed_events
      properties:
        target_url:
          type: string
          format: uri
          description: URL where webhook events will be sent. Must be HTTPS.
        subscribed_events:
          type: array
          description: List of event types to subscribe to
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
    DeliveryStatus:
      type: string
      description: Current delivery status of a message
      enum:
        - sent
        - delivered
        - received
        - read
    ErrorCode:
      type: integer
      description: Linq API error code.
    ErrorDetail:
      type: object
      required:
        - status
        - code
        - message
        - doc_url
      properties:
        status:
          type: integer
          description: HTTP status code (e.g., 400, 404, 500)
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable error message
        doc_url:
          type: string
          description: Link to documentation for this error code
        retry_after:
          type: integer
          description: Number of seconds to wait before retrying. Only present on 429 rate limit errors.
    ErrorResponse:
      type: object
      required:
        - error
        - success
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        success:
          type: boolean
          description: Always false for error responses
        trace_id:
          type: string
          description: Unique trace ID for request tracing and debugging
    GetContactCardResponse:
      type: object
      required:
        - contact_cards
      properties:
        contact_cards:
          type: array
          items:
            $ref: '#/components/schemas/ContactCardItem'
    GetMessagesResult:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          description: List of messages
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type:
            - string
            - 'null'
          description: |
            Cursor for fetching the next page of results.
            Null if there are no more results to fetch.
            Pass this value as the `cursor` parameter in the next request.
    GetThreadResponse:
      type: object
      description: Response containing messages in a thread with pagination
      required:
        - messages
      properties:
        messages:
          type: array
          description: Messages in the thread, ordered by the specified order parameter
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type:
            - string
            - 'null'
          description: Cursor for fetching the next page of results (null if no more results)
    InstallContactRequest:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          type: string
          enum:
            - exact_handle
            - share_link
    InstallContactResponse:
      type: object
      additionalProperties: false
      required:
        - agent
        - conversation_id
      properties:
        agent:
          $ref: '#/components/schemas/AgentContact'
        conversation_id:
          type: string
          format: uuid
    LinkPart:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - link
          description: Indicates this is a rich link preview part
        value:
          type: string
          format: uri
          description: |
            URL to send with a rich link preview. The recipient will see an inline card
            with the page's title, description, and preview image (when available).

            A `link` part must be the **only** part in the message. To send a URL as plain
            text (no preview card), use a `text` part instead.
          minLength: 1
          maxLength: 2048
    LinkPartResponse:
      type: object
      description: A rich link preview part
      required:
        - type
        - value
        - reactions
      properties:
        type:
          type: string
          enum:
            - link
          description: Indicates this is a rich link preview part
        value:
          type: string
          description: The URL
        reactions:
          type:
            - array
            - 'null'
          description: Reactions on this message part
          items:
            $ref: '#/components/schemas/Reaction'
    ListBlockedHandlesResult:
      type: object
      required:
        - blocked_handles
      properties:
        blocked_handles:
          type: array
          description: Contacts blocked by the authenticated Contact, newest first.
          items:
            $ref: '#/components/schemas/BlockedHandleEntry'
    ListChatsResult:
      type: object
      required:
        - chats
      properties:
        chats:
          type: array
          description: List of chats
          items:
            $ref: '#/components/schemas/Chat'
        next_cursor:
          type:
            - string
            - 'null'
          description: |
            Cursor for fetching the next page of results.
            Null if there are no more results to fetch.
            Pass this value as the `cursor` parameter in the next request.
    ListWebhookSubscriptionsResult:
      type: object
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          description: List of webhook subscriptions
          items:
            $ref: '#/components/schemas/WebhookSubscriptionResponse'
    MediaPart:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        url:
          type: string
          format: uri
          description: Public HTTPS media URL. Relay validates the response status, declared and actual size, redirect protocol, and supported Content-Type.
          pattern: ^https://
        attachment_id:
          type: string
          format: uuid
          description: |
            Reference to a file pre-uploaded via `POST /v1/attachments` (optional).
            The file is already stored, so sends using this ID skip the download step —
            useful when sending the same file to many recipients.

            Either `url` or `attachment_id` must be provided, but not both.
    MediaPartResponse:
      type: object
      description: A media attachment part
      required:
        - type
        - id
        - url
        - filename
        - mime_type
        - size_bytes
        - reactions
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        id:
          type: string
          format: uuid
          description: Unique attachment identifier
        url:
          type: string
          format: uri
          description: |
            Presigned URL for downloading the attachment (expires in 1 hour).
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type of the file
        size_bytes:
          type: integer
          description: File size in bytes
        reactions:
          type:
            - array
            - 'null'
          description: Reactions on this message part
          items:
            $ref: '#/components/schemas/Reaction'
        duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Audio or video duration in milliseconds when known.
        width:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Pixel width when known. Width and height are supplied together.
        height:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Pixel height when known. Width and height are supplied together.
    Message:
      type: object
      required:
        - id
        - chat_id
        - is_from_me
        - is_delivered
        - is_read
        - delivery_status
        - created_at
        - updated_at
        - is_system_message
      properties:
        id:
          type: string
          description: Unique identifier for the message
          format: uuid
        chat_id:
          type: string
          description: ID of the chat this message belongs to
          format: uuid
        from:
          type:
            - string
            - 'null'
          description: Sender Relay Handle.
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ChatHandle'
            - type: 'null'
        parts:
          type:
            - array
            - 'null'
          description: Message parts in order (text, media, and link)
          items:
            oneOf:
              - $ref: '#/components/schemas/TextPartResponse'
              - $ref: '#/components/schemas/MediaPartResponse'
              - $ref: '#/components/schemas/LinkPartResponse'
              - $ref: '#/components/schemas/SystemPartResponse'
        reply_to:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ReplyTo'
            - type: 'null'
        is_from_me:
          type: boolean
          description: Whether this message was sent by the authenticated user
        is_delivered:
          type: boolean
          deprecated: true
          description: 'DEPRECATED: Use `delivery_status` instead (true when `delivery_status` is `delivered` or `read`). Whether the message has been delivered.'
        is_read:
          type: boolean
          deprecated: true
          description: 'DEPRECATED: Use `delivery_status == "read"` instead. Whether the message has been read.'
        delivery_status:
          $ref: '#/components/schemas/DeliveryStatus'
        created_at:
          type: string
          format: date-time
          description: When the message was created
        updated_at:
          type: string
          format: date-time
          description: When the message was last updated
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was sent
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was delivered
        read_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was read
        is_system_message:
          type: boolean
          description: Whether this timeline item is a visible group-history event.
        system_event:
          oneOf:
            - $ref: '#/components/schemas/SystemEvent'
            - type: 'null'
    MessageContent:
      type: object
      description: One message containing 1–100 ordered text, media, or link parts. A link must be the only part.
      oneOf:
        - required:
            - parts
      properties:
        parts:
          x-go-type-skip-optional-pointer: true
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/MessagePart'
        reply_to:
          $ref: '#/components/schemas/ReplyTo'
          description: Reply to another message to create a threaded conversation
        idempotency_key:
          type: string
          description: |
            Optional idempotency key for this message.
            Use this to prevent duplicate sends of the same message. Reusing a key
            whose message was deleted — or was an ephemeral message that has since
            expired — returns 404; the message is never resent.
          maxLength: 255
    MessageDeliveredWebhookV2:
      description: Complete webhook payload for message.delivered events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    MessageEventV2:
      type: object
      description: Unified payload for the current Relay message.sent, message.received, message.delivered, and message.read webhooks. direction is relative to the receiving agent.
      required:
        - chat
        - id
        - direction
        - sender_handle
        - parts
      properties:
        chat:
          type: object
          description: Chat information
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
              description: Chat identifier
            is_group:
              type:
                - boolean
                - 'null'
              description: Whether this is a group chat
            owner_handle:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/ChatHandle'
                - type: 'null'
        id:
          type: string
          format: uuid
          description: Message identifier
        idempotency_key:
          type:
            - string
            - 'null'
          description: Idempotency key for deduplication of outbound messages.
        direction:
          type: string
          description: Message direction - "outbound" if sent by you, "inbound" if received
          enum:
            - inbound
            - outbound
        sender_handle:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The handle that sent this message
        parts:
          type: array
          description: Message parts (text and/or media)
          items:
            oneOf:
              - $ref: '#/components/schemas/schemas-TextPartResponse'
              - $ref: '#/components/schemas/schemas-MediaPartResponse'
              - $ref: '#/components/schemas/schemas-LinkPartResponse'
            discriminator:
              propertyName: type
              mapping:
                text: '#/components/schemas/schemas-TextPartResponse'
                media: '#/components/schemas/schemas-MediaPartResponse'
                link: '#/components/schemas/schemas-LinkPartResponse'
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was sent. Null if not yet sent.
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was delivered. Null if not yet delivered.
        read_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was read. Null if not yet read.
        reply_to:
          type:
            - object
            - 'null'
          description: Reference to the message this is replying to (for threaded replies)
          properties:
            message_id:
              type: string
              format: uuid
              description: ID of the message being replied to
            part_index:
              type: integer
              format: int32
              minimum: 0
              description: Index of the part being replied to
    MessagePart:
      type: object
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextPart'
          media: '#/components/schemas/MediaPart'
          link: '#/components/schemas/LinkPart'
      oneOf:
        - $ref: '#/components/schemas/TextPart'
        - $ref: '#/components/schemas/MediaPart'
        - $ref: '#/components/schemas/LinkPart'
    MessageReadWebhookV2:
      description: Complete webhook payload for message.read events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    MessageReceivedWebhookV2:
      description: Complete webhook payload for message.received events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    MessageSentWebhookV2:
      description: Complete webhook payload for message.sent events (2026-02-03 format)
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MessageEventV2'
    ParticipantAddedEvent:
      type: object
      description: Payload for participant.added webhook events
      required:
        - handle
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        handle:
          type: string
          deprecated: true
        participant:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The added participant as a full handle object
        added_at:
          type: string
          format: date-time
          description: When the participant was added
    ParticipantAddedWebhook:
      description: Complete webhook payload for participant.added events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ParticipantAddedEvent'
    ParticipantRemovedEvent:
      type: object
      description: Payload for participant.removed webhook events
      required:
        - handle
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        handle:
          type: string
          deprecated: true
        participant:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The removed participant as a full handle object
        removed_at:
          type: string
          format: date-time
          description: When the participant was removed
    ParticipantRemovedWebhook:
      description: Complete webhook payload for participant.removed events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ParticipantRemovedEvent'
    Reaction:
      type: object
      required:
        - is_me
        - handle
        - type
      properties:
        is_me:
          type: boolean
          description: Whether this reaction is from the current user
        handle:
          $ref: '#/components/schemas/ChatHandle'
        type:
          $ref: '#/components/schemas/ReactionType'
        custom_emoji:
          type:
            - string
            - 'null'
          description: Custom emoji if type is "custom", null otherwise
    ReactionAddedEvent:
      description: Payload for reaction.added webhook events
      allOf:
        - $ref: '#/components/schemas/ReactionEventBase'
    ReactionAddedWebhook:
      description: Complete webhook payload for reaction.added events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReactionAddedEvent'
    ReactionEventBase:
      type: object
      required:
        - reaction_type
        - is_from_me
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID)
        from:
          type: string
          deprecated: true
        from_handle:
          allOf:
            - $ref: '#/components/schemas/ChatHandle'
          description: The person who added/removed the reaction as a full handle object
        message_id:
          type: string
          description: Message identifier (UUID) that the reaction was added to or removed from
        part_index:
          type: integer
          format: int32
          minimum: 0
          description: Index of the message part that was reacted to (0-based)
        reaction_type:
          $ref: '#/components/schemas/ReactionType'
        custom_emoji:
          type:
            - string
            - 'null'
          description: The actual emoji when reaction_type is "custom". Null for standard tapbacks.
        is_from_me:
          type: boolean
        reacted_at:
          type: string
          format: date-time
          description: When the reaction was added or removed
    ReactionRemovedEvent:
      description: Payload for reaction.removed webhook events
      allOf:
        - $ref: '#/components/schemas/ReactionEventBase'
    ReactionRemovedWebhook:
      description: Complete webhook payload for reaction.removed events
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReactionRemovedEvent'
    ReactionType:
      type: string
      description: Six standard tapbacks or a custom Unicode emoji.
      enum:
        - love
        - like
        - dislike
        - laugh
        - emphasize
        - question
        - custom
    RemoveParticipantRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Relay Handle.
    ReplyTo:
      type: object
      description: Indicates this message is a threaded reply to another message
      required:
        - message_id
      properties:
        message_id:
          type: string
          format: uuid
          description: The ID of the message to reply to
        part_index:
          type: integer
          format: int32
          description: |
            The specific message part to reply to (0-based index).
            Defaults to 0 (first part) if not provided.
            Use this when replying to a specific part of a multipart message.
          minimum: 0
    RequestUploadRequest:
      type: object
      required:
        - filename
        - content_type
        - size_bytes
      properties:
        filename:
          type: string
          description: Name of the file to upload
          minLength: 1
          maxLength: 255
        content_type:
          $ref: '#/components/schemas/SupportedContentType'
        size_bytes:
          type: integer
          format: int64
          description: Size of the file in bytes (max 100MB)
          minimum: 1
          maximum: 104857600
        duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Audio or video duration in milliseconds when known.
        width:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Pixel width when known. Width and height are supplied together.
        height:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Pixel height when known. Width and height are supplied together.
    RequestUploadResult:
      type: object
      required:
        - attachment_id
        - upload_url
        - download_url
        - http_method
        - expires_at
        - required_headers
      properties:
        attachment_id:
          type: string
          description: Unique identifier for the attachment
          format: uuid
        upload_url:
          type: string
          format: uri
          description: |
            Presigned URL for uploading the file. PUT the raw binary file content to this URL
            with the `required_headers`. Do not JSON-encode or multipart-wrap the body.
            Expires after 15 minutes. Treat the URL as opaque — the hostname depends on
            Relay account configuration and is the same across sandbox and production.
        download_url:
          type: string
          format: uri
          description: |
            Permanent CDN URL for the file. Does not expire. Use the `attachment_id`
            to reference this file in media parts when sending messages.
        http_method:
          type: string
          description: HTTP method to use for upload (always PUT)
          enum:
            - PUT
        expires_at:
          type: string
          format: date-time
          description: When the upload URL expires (15 minutes from now)
        required_headers:
          type: object
          description: |
            HTTP headers that must be set on the upload request. The presigned URL is signed
            with these exact values — S3 will reject the upload if they don't match.
          additionalProperties:
            type: string
    SendMessageRequest:
      type: object
      description: |
        Send a message with an auto-selected from-number. The recipient set (`to`)
        is the chat identity; the platform resolves the line and target chat.
      required:
        - to
        - message
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 31
          items:
            type: string
        message:
          allOf:
            - $ref: '#/components/schemas/MessageContent'
          description: |
            The message to send. Text, media, and attachment parts are all
            supported. **Unlike `POST /v1/chats`, a link is allowed even as the
            first message of a newly created chat** — but a link as the very first
            message on a freshly selected line can elevate that line's flagging
            risk. Voice memos are not supported here; use
            `POST /v1/chats/{chatId}/voicememo`.
    SendMessageResponse:
      type: object
      description: Response for sending a message to a chat
      required:
        - chat_id
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: Unique identifier of the chat this message was sent to
        message:
          $ref: '#/components/schemas/SentMessage'
    SendMessageResult:
      type: object
      description: |
        Result of an auto-from send. Self-describing: which line was used, which
        chat the message landed in, whether a new chat was created, and the
        resulting message id(s).
      required:
        - chat_id
        - created_new_chat
        - from
        - is_group
        - handles
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: The resolved chat (reused or newly created) the message landed in.
        created_new_chat:
          type: boolean
        from:
          type: string
          description: The line (E.164) the message was actually sent from.
        is_group:
          type: boolean
          description: Whether the resolved chat is a group chat.
        handles:
          type: array
          description: Participants of the resolved chat.
          items:
            $ref: '#/components/schemas/ChatHandle'
        message:
          allOf:
            - $ref: '#/components/schemas/SentMessage'
          description: The primary message that was sent.
    SendMessageToChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/MessageContent'
    SendReactionRequest:
      type: object
      required:
        - operation
        - type
      properties:
        operation:
          type: string
          description: Whether to add or remove the reaction
          enum:
            - add
            - remove
        type:
          $ref: '#/components/schemas/ReactionType'
        custom_emoji:
          type: string
          description: |
            Custom emoji string. Required when type is "custom".
        part_index:
          type: integer
          description: |
            Optional index of the message part to react to.
            If not provided, reacts to the entire message (part 0).
      if:
        properties:
          type:
            const: custom
      then:
        required:
          - custom_emoji
    SendVoiceMemoToChatRequest:
      type: object
      description: |
        Request to send a voice memo to a chat (chat_id provided in path).
        Exactly one of `voice_memo_url` or `attachment_id` must be provided.
      properties:
        voice_memo_url:
          type: string
          format: uri
          description: |
            URL of the voice memo audio file. Must be a publicly accessible HTTPS URL.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
        attachment_id:
          type: string
          format: uuid
          description: |
            Reference to a voice memo file pre-uploaded via `POST /v1/attachments`.
            The file is already stored, so sends using this ID skip the download step.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
      oneOf:
        - required:
            - voice_memo_url
          not:
            required:
              - attachment_id
        - required:
            - attachment_id
          not:
            required:
              - voice_memo_url
    SendVoiceMemoToChatResult:
      type: object
      description: Response for sending a voice memo to a chat
      required:
        - voice_memo
      properties:
        voice_memo:
          type: object
          required:
            - id
            - from
            - to
            - status
            - voice_memo
            - created_at
            - chat
          properties:
            id:
              type: string
              format: uuid
              description: Message identifier
            from:
              type: string
            to:
              type: array
              items:
                type: string
            status:
              type: string
              description: Current delivery status
            voice_memo:
              $ref: '#/components/schemas/VoiceMemoAttachment'
            created_at:
              type: string
              format: date-time
              description: When the voice memo was created
            chat:
              $ref: '#/components/schemas/ChatInfo'
    SentMessage:
      type: object
      description: A message that was sent (used in CreateChat and SendMessage responses)
      required:
        - id
        - parts
        - created_at
        - sent_at
        - delivery_status
        - is_read
      properties:
        id:
          type: string
          format: uuid
          description: Message identifier (UUID)
        parts:
          type: array
          description: Message parts in order (text, media, and link)
          items:
            oneOf:
              - $ref: '#/components/schemas/TextPartResponse'
              - $ref: '#/components/schemas/MediaPartResponse'
              - $ref: '#/components/schemas/LinkPartResponse'
        created_at:
          type: string
          format: date-time
          description: When the message was created
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was actually sent (null if still queued)
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the message was delivered
        delivery_status:
          $ref: '#/components/schemas/DeliveryStatus'
        is_read:
          type: boolean
          deprecated: true
          description: 'DEPRECATED: Use `delivery_status == "read"` instead. Whether the message has been read.'
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ChatHandle'
            - type: 'null'
        reply_to:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ReplyTo'
            - type: 'null'
    SetContactCardRequest:
      type: object
