      description: Block a handle. Uses Relay Handles and the retained Linq method and payload shape where it fits Relay.
    delete:
      operationId: unblockHandle
      summary: Unblock a handle
      description: Unblock a handle. Uses Relay Handles and the retained Linq method and payload shape where it fits Relay.
      tags:
        - Blocked Handles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnblockHandleRequest'
      responses:
        '204':
          description: Handle unblocked successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhook-events:
    get:
      operationId: listWebhookEvents
      summary: List available webhook event types
      description: List available webhook event types. Uses Relay Handles and the retained Linq method and payload shape where it fits Relay.
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of available webhook event types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/webhook-subscriptions:
    post:
      operationId: createWebhookSubscription
      summary: Create a new webhook subscription
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
      responses:
        '201':
          description: Webhook subscription created successfully. The signing_secret is only returned in this response - store it securely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
