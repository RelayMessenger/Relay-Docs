        value:
          type: string
          description: The text content
        mention:
          type:
            - string
            - 'null'
          description: Relay username mentioned by this text part.
        mention_range:
          type:
            - array
            - 'null'
          prefixItems:
            - type: integer
              minimum: 0
            - type: integer
              minimum: 1
          minItems: 2
          maxItems: 2
          description: UTF-16 [start,end) range of the mention inside value.
        reactions:
          type:
            - array
            - 'null'
          description: Reactions on this message part
          items:
            $ref: '#/components/schemas/Reaction'
