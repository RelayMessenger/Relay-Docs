openapi: 3.1.0
info:
  title: Relay developer API
  version: "0.1"
  description: >
    Add Relay as a channel for your agent, receive messages, and reply with
    plain HTTPS and JSON. Authenticate every request with an Agent Token unless
    the endpoint is marked otherwise. Data parts are stored and delivered as
    sent and render through their fallback text, except for the reserved
    `data.type` values Relay resolves itself.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.relayapp.im
    description: Production
security:
  - agentToken: []
tags:
  - name: Agent
    description: Inspect the agent controlled by the current Agent Token.
  - name: Messages
    description: Send a message, read history, and react.
  - name: Conversations
    description: >
      List the conversations an agent is in, advance receipts, and show the
      typing indicator.
  - name: Events
    description: >
      Receive durable inbound events, either through signed webhook receivers
      or by pulling `GET /v1/events`. Both work at once: one durable log per
      agent feeds both transports. Delivery is at least once everywhere;
      always deduplicate by `event_id`.
  - name: Attachments
    description: Upload bytes once and reference them from any number of parts.
  - name: Pairing
    description: >
      Device authorization (RFC 8628) for terminal bridges. Four calls, in this
      order: the computer asks for a code, the person opens the verification URI
      so the code is claimed for their account, the person approves it, and the
      computer exchanges the code for a session it uses to provision its agent
      and mint that agent's token. The token never travels to the phone.
  - name: Public
    description: Share profiles.

paths:
  /v1/agents/me:
    get:
      tags: [Agent]
      summary: Verify the agent token
      description: Verify an Agent Token and read the agent profile it controls.
      operationId: getAgentMe
      responses:
        "200":
          description: The authenticated agent profile.
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    $ref: "#/components/schemas/AgentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/{user_id}:
    get:
      tags: [Agent]
      summary: Get a user
      description: >
        Resolve a human participant your agent is in conversation with. Every
        `message.received` event carries `data.message.sender.id` (a `usr_…`
        id); pass it here to read that sender's name and messaging phone
        number, enough to greet them or match them to an existing account.


        Scope: the user must currently share an active conversation with your
        agent. Any other id (unknown, or a user you have no active
        conversation with) returns `404` so the endpoint can neither enumerate
        accounts nor confirm who owns a phone number.
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The `sender_handle.id` from a `message.received` event.
          example: usr_01JZU1F0BD
      responses:
        "200":
          description: The resolved user profile.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/messages:
    post:
      tags: [Messages]
      summary: Send a message
      description: >
        Send as the authenticated agent. One send is one message: text and
        media handed over together stay together as the ordered parts of a
        single message, and every committed part is given a permanent
        `part_id`.


        `message_id` is the canonical id of the resulting message and the
        send's idempotency key. Mint it before queueing the send: retrying with
        the same id replays the stored message, and an id already committed by
        another sender answers `409 idempotency_conflict` without revealing
        whose it is. Omit it and Relay mints one, which makes the send
        non-idempotent; an `Idempotency-Key` header is read only when it is
        itself a `msg_` id.


        `reply_to` is a pointer, never a copy: it names a message of this
        conversation and optionally one exact part of it, and the client draws
        the quote from the target.
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "202":
          description: Send accepted; the committed message.
          content:
            application/json:
              schema:
                type: object
                required: [message_id, message]
                properties:
                  message_id:
                    type: string
                    description: The canonical id, equal to `message.id`.
                    example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy
                  message:
                    $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The agent is not an active participant, or is blocked or not installed for the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The conversation does not exist, or the reply target does not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            `idempotency_conflict`: this `message_id` is already committed by a
            different sender or with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body exceeds 512 KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The message id, conversation id, parts, attachment reference, or reply target is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/CommitUnavailable"

  /v1/messages/{message_id}/reactions:
    post:
      tags: [Messages]
      summary: Add or remove a reaction
      description: >
        Add or remove an emoji on a message, or on one exact part of it.
        Recipients receive `reaction.added` / `reaction.removed` events.


        One reaction per actor per target slot, the way an iMessage tapback
        behaves: adding a second emoji to a slot replaces the first, and
        removing one that is not there is a documented no-op that answers `200`
        with `changed: false`. Events are emitted only when `changed` is true,
        so a retry costs the recipient nothing and no operation id is needed.


        Omit `target_part_id` to react to the whole message. Send it to react
        to one part, of any kind.
      operationId: reactToMessage
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: >
            Reaction state updated. The body echoes the reaction Relay
            recorded, which is also what recipients receive in the
            `reaction.added` or `reaction.removed` event.
          content:
            application/json:
              schema:
                type: object
                required: [reaction]
                properties:
                  reaction:
                    $ref: "#/components/schemas/Reaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            The actor is not an active participant, the target sits outside
            the actor's membership window, or the agent is blocked or not
            installed for this conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The message does not exist or is not visible to this actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The operation, type, or emoji is invalid, or `target_part_id` names
            a part this message does not have.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"

  /v1/chats:
    get:
      tags: [Conversations]
      summary: List conversations
      description: >
        List conversations where the authenticated agent is an active
        participant. Results are ordered by `last_message_at` descending, with
        conversations that have no messages last. Pass the opaque
        `next_cursor` unchanged to read the next page; it is omitted on the
        final page.
      operationId: listConversations
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque `next_cursor` from the previous page.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Conversations visible to this agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConversationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Cursor or limit is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/chats/{chat_id}:
    get:
      tags: [Conversations]
      summary: Get a conversation
      description: >
        Read one conversation where the authenticated agent is an active
        participant. Unknown conversations and conversations outside the
        agent's active membership both return 404.
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation visible to this agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/chats/{chat_id}/messages:
    get:
      tags: [Messages]
      summary: Read conversation history
      description: >
        Read a conversation's messages, newest first, inside the caller's
        membership window. Page backwards with `before_sequence`. Group
        membership is what grants access: an agent in a group reads the group's
        history from the sequence it joined at, exactly as a person does.


        History projections carry the reader's view of each message: the
        current `reactions` and — in a 1:1 conversation — the sender's
        `delivered_at` / `read_at` stamps.
      operationId: listConversationMessages
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before_sequence
          in: query
          schema:
            type: integer
          description: Return only messages with a lower sequence.
      responses:
        "200":
          description: Messages, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The actor is not a participant in this conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Messages]
      summary: Send a message into a conversation
      description: >
        The conversation-scoped form of a send, with the same body and the same
        idempotency rules as `POST /v1/messages`. It answers `201` and wraps
        the committed message in an array of one, which is the shape shipped
        clients read; `/v2` returns the message on its own. Both commit exactly
        one message.
      operationId: sendConversationMessage
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: The committed message, as an array of one.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The sender is not an active participant of this conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`idempotency_conflict`: this `message_id` belongs to a different request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body exceeds 512 KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The message id, parts, an attachment reference, or the reply target is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/CommitUnavailable"

  /v2/chats/{chat_id}/messages:
    post:
      tags: [Messages]
      summary: Send one message
      description: >
        The current send. One send is one message, the response is the message
        on its own, and the request body is validated strictly: any field
        outside `message_id`, `parts`, `reply_to` and `text` answers
        `422`.


        The client mints `message_id` before queueing the send. It is the
        canonical id and the idempotency key: retrying with the same id and the
        same request replays the original `201`, and an id already taken by
        another sender answers `409 idempotency_conflict` without revealing
        whose it is. No `Idempotency-Key` header is involved, and unlike `/v1`
        the id is required.
      operationId: sendMessageV2
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageV2Input"
      responses:
        "201":
          description: The committed message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageV2Response"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The sender is not an active participant of this conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `idempotency_conflict`: this `message_id` is already committed with
            a different request, or is still in flight. A `Retry-After` header
            is present in the in-flight case.
          headers:
            Retry-After:
              description: Whole seconds until the in-flight operation should be retried.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body exceeds 512 KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            An unexpected field is present, or the message id, parts, an
            attachment reference, or the reply target is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/CommitUnavailable"

  /v1/webhooks:
    get:
      tags: [Events]
      summary: List webhooks
      description: List the authenticated agent's webhook endpoints, newest first. Signing secrets are never returned.
      operationId: listWebhooks
      responses:
        "200":
          description: Registered webhook endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Events]
      summary: Register a webhook
      description: >
        Register a public HTTPS receiver. The signing secret is returned only
        in this response. An agent may have up to five enabled endpoints.
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreateInput"
      responses:
        "201":
          description: Webhook registered; store the signing secret now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            `conflict`: this URL is already registered. `limit_exceeded`: five
            endpoints already exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid URL or event filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"
        "503":
          $ref: "#/components/responses/WebhookDeliveryUnavailable"

  /v1/webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    patch:
      tags: [Events]
      summary: Update a webhook
      description: >
        Change the URL, event filters, or enabled state. At least one field is
        required. Disabling stamps `disabled_at` and records
        `disabled_by_agent`.
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdateInput"
      responses:
        "200":
          description: Updated endpoint.
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook:
                    $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Webhook not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: URL already registered, or five enabled endpoints already exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Events]
      summary: Delete a webhook
      description: Permanently deletes the endpoint and stops new deliveries to it.
      operationId: deleteWebhook
      responses:
        "204":
          description: Webhook deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Webhook not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/webhooks/{webhook_id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      tags: [Events]
      summary: Rotate a webhook secret
      description: >
        Returns a new signing secret once. For 24 hours Relay includes
        signatures from both the new and previous secret for zero-downtime
        rotation.
      operationId: rotateWebhookSecret
      responses:
        "200":
          description: Secret rotated; store the new secret now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Webhook not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"
        "503":
          $ref: "#/components/responses/WebhookDeliveryUnavailable"

  /v1/events:
    get:
      tags: [Events]
      summary: Pull events
      description: >
        Drain the agent's durable event log past `after`. This is a plain pull:
        `after` is the last `sequence` you have processed, the page is
        everything newer, and nothing is acknowledged or consumed. A consumer
        that sees an event twice ignores it by `event_id`.


        `timeout` greater than zero holds the request open until something
        arrives, up to thirty seconds. Persist the events and the new cursor
        together before advancing, and read `has_more` to know whether to pull
        again immediately.


        Polling works alongside webhooks: both transports read one log, so an
        agent may run either or both.
      operationId: pollEvents
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: >
            The highest `sequence` this consumer has processed. `0` starts from
            the beginning of the retained log. `cursor` is accepted as an alias.
        - name: timeout
          in: query
          schema: { type: integer, minimum: 0, maximum: 30, default: 0 }
          description: >-
            Seconds to hold the request open when no events are pending.
            0 returns immediately with any pending events (nonblocking pull).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Events past the cursor, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, next_cursor, latest, has_more]
                properties:
                  events:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/Event"
                  next_cursor:
                    type: integer
                    description: >
                      The `sequence` of the last event on this page. Pass it as
                      `after` on the next pull; it equals the request's `after`
                      when the page is empty.
                  latest:
                    type: integer
                    description: The highest sequence Relay has written to this agent's log.
                  has_more:
                    type: boolean
                    description: True when `next_cursor` is behind `latest`, so another page is waiting.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >
            `after`, `timeout`, or `limit` does not satisfy its exact integer
            bounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: >
            Too many held-open pulls. Charged only when `timeout` is greater
            than zero.
          headers:
            Retry-After:
              description: Whole seconds before another held-open pull.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload an attachment
      description: >-
        Streams one raw request body directly to Relay storage, up to 100 MB.
        `Content-Length` is required and Relay verifies it against the stored
        object size. `Content-Type` sets the stored MIME type;
        `X-Relay-Filename` names downloads. Agent tokens and user sessions both
        work; the attachment is private to its uploader. The upload budget is
        counted in megabytes rather than requests, and it is charged from the
        declared `Content-Length` before the body streams.
      tags: [Attachments]
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - in: header
          name: Content-Length
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 104857600
          description: Exact raw request-body size in bytes.
        - in: header
          name: Content-Type
          schema: { type: string }
          example: image/png
        - in: header
          name: X-Relay-Filename
          schema: { type: string }
          example: chart.png
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored and available.
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment:
                    type: object
                    required: [id, url, content_type, filename, size_bytes]
                    properties:
                      id: { type: string, example: att_01KXGWNZFR }
                      url: { type: string, description: Capability download URL. }
                      content_type: { type: string, example: image/png }
                      filename: { type: string, example: chart.png }
                      size_bytes: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The declared attachment size exceeds 100 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Content-Length is missing or invalid, the body is empty, the stored
            size does not match the declaration, or the bytes do not match the
            declared type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"

  /v1/attachments/{attachment_id}:
    get:
      operationId: getAttachment
      summary: Get attachment metadata
      description: Uploader-only. Others receive 404.
      tags: [Attachments]
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - in: path
          name: attachment_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Metadata and download URL.
          content:
            application/json:
              schema:
                type: object
                required: [attachment]
                properties:
                  attachment:
                    type: object
                    properties:
                      id: { type: string }
                      state: { type: string, enum: [pending, available, failed, rejected, deleted] }
                      content_type: { type: string }
                      filename: { type: string }
                      size_bytes: { type: integer }
                      url: { type: [string, "null"] }
                      created_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found or not the uploader.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/chats/{chat_id}/typing:
    post:
      operationId: setTyping
      summary: Start or stop the typing indicator
      description: >-
        Ephemeral, the way iMessage treats it: the signal is pushed to the
        other people's live devices and nothing is stored, so it takes no
        sequence, never enters the event log, and is never replayed. Recipients
        receive `chat.typing_indicator.started` or `chat.typing_indicator.stopped` carrying `timeout_ms`, and
        hide the indicator on their own once that many milliseconds pass
        without a refresh. Send the start again while still composing to keep
        it alive.


        The signal reaches the conversation's other people, never other agents,
        and its payload is
        `{ "chat_id": "cnv_…", "participant": { "kind": "agent", "id":
        "agt_…" }, "timeout_ms": 90000 }`.
      tags: [Conversations]
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                started:
                  type: boolean
                  default: true
                  description: >
                    `false` stops the indicator. Any other value, and an absent
                    or unparseable body, mean started.
      responses:
        "204":
          description: Signal accepted. There is no body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            The actor is not a participant, or the agent is blocked or not
            installed for this conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"

  /v1/chats/{chat_id}/delivered:
    post:
      operationId: markDelivered
      summary: Advance the delivery watermark
      description: >-
        Records that the caller received everything through `message_id`.
        Only a recipient can advance this watermark. Older or repeated targets
        are idempotent no-ops and never imply that the messages were read.
        Pulling a page of `/v1/events` already stamps the messages in it
        delivered, so an agent needs this only for an explicit stamp.
      tags: [Conversations]
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "200":
          description: Delivery watermark state after the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The actor is not a participant, or the message is outside its membership window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The conversation or message was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: message_id is missing, malformed, or names the caller's own message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"

  /v1/chats/{chat_id}/read:
    post:
      operationId: markRead
      summary: Advance the read watermark
      description: >-
        Marks everything through `message_id` read for the caller. Read implies
        delivered; older or repeated targets are idempotent no-ops.
      tags: [Conversations]
      security:
        - agentToken: []
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "200":
          description: Watermark state after the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The actor is not a participant, or the message is outside its membership window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The conversation or message was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: message_id is missing, malformed, or names the caller's own message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"

  /api/auth/device/code:
    post:
      tags: [Pairing]
      summary: Request a device code
      description: >
        Step one of RFC 8628 device authorization, and the way a terminal
        bridge pairs with a Relay account. No authentication; show the returned
        `user_code` (and a QR of `verification_uri_complete`) to the person,
        then poll `POST /api/auth/device/token` every `interval` seconds. Codes
        expire after `expires_in` seconds.


        The person must open the verification URI before approving. That read
        is what binds the pending request to their account; approving a code
        nobody has opened answers `400 invalid_request`.
      operationId: requestDeviceCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
                  description: The identifier of the bridge asking to pair.
                  example: relay-cli
                scope:
                  type: string
                  description: Space-separated scopes, when the bridge asks for any.
      responses:
        "200":
          description: Codes issued; show the user code and start polling.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                properties:
                  device_code:
                    type: string
                    description: The bridge's secret half. Never show it to the person.
                  user_code:
                    type: string
                    description: The short code the person types into the Relay app.
                    example: ABCD-EFGH
                  verification_uri:
                    type: string
                    format: uri
                  verification_uri_complete:
                    type: string
                    format: uri
                    description: The same URI with the user code embedded, for a QR or a deep link.
                  expires_in:
                    type: integer
                    description: Seconds until the codes stop being claimable.
                    example: 600
                  interval:
                    type: integer
                    description: Minimum seconds between token polls.
                    example: 5
        "400":
          description: >
            `invalid_request` or `invalid_client`, in the RFC 8628 error shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationError"

  /api/auth/device:
    get:
      tags: [Pairing]
      summary: Claim a device code
      description: >
        Step two, and not only a read. Looking a pending `user_code` up while
        signed in CLAIMS it for that account, which is the binding
        `POST /api/auth/device/approve` requires. Skip this call and the
        approval answers `400 invalid_request`.


        The Relay app calls this to render the approval sheet. `client_id` and
        `scope` come back only to the person the request is now bound to.
      operationId: getDeviceAuthorization
      security:
        - userSession: []
      parameters:
        - name: user_code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current status of the device authorization.
          content:
            application/json:
              schema:
                type: object
                required: [user_code, status]
                properties:
                  user_code: { type: string }
                  status:
                    type: string
                    enum: [pending, approved, denied]
                  client_id: { type: string }
                  scope: { type: string }
        "400":
          description: The user code is unknown or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationError"

  /api/auth/device/approve:
    post:
      tags: [Pairing]
      summary: Approve a device
      description: >
        Step three. The signed-in person approves the pairing they are looking
        at. Only the account that claimed the code with `GET /api/auth/device`
        may approve it, and only while it is still pending. An unclaimed code
        answers `400 invalid_request`.
      operationId: approveDeviceAuthorization
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
                  description: The code shown on the computer.
      responses:
        "200":
          description: Approved. The waiting computer's next token poll succeeds.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
        "400":
          description: The user code is unknown, expired, unclaimed, or already answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`access_denied`: this account may not approve that request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationError"

  /api/auth/device/token:
    post:
      tags: [Pairing]
      summary: Exchange a device code for a session
      description: >
        Step four. Poll no faster than the `interval` returned with the code. `authorization_pending` means keep waiting, `slow_down` means
        wait longer, and `expired_token` or `access_denied` end the attempt.


        A success returns a Relay user session. That session is not an Agent
        Key: use it once to create the bridge's agent with `POST /v1/me/agents`,
        store the `rly_live_…` key that call returns, and authenticate every
        later API request with the token alone.
      operationId: exchangeDeviceCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, device_code, client_id]
              properties:
                grant_type:
                  type: string
                  const: "urn:ietf:params:oauth:grant-type:device_code"
                device_code:
                  type: string
                client_id:
                  type: string
      responses:
        "200":
          description: The approved session.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                    description: Bearer session token for the paired Relay account.
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer }
                  scope: { type: string }
        "400":
          description: >
            `authorization_pending`, `slow_down`, `expired_token`,
            `access_denied`, `invalid_request`, or `invalid_grant`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationError"

  /v1/me/agents:
    post:
      tags: [Pairing]
      summary: Create an agent and mint its token
      description: >
        Creates an agent owned by the signed-in person and returns its Agent
        Token. This is the only response that carries the token; store it now.
        A terminal bridge calls this once, with the session it received from
        the device flow, and then uses the token for everything else.
      operationId: createOwnedAgent
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentInput"
      responses:
        "201":
          description: Agent created; store the token now.
          content:
            application/json:
              schema:
                type: object
                required: [agent, token, chat_id]
                properties:
                  agent:
                    $ref: "#/components/schemas/Agent"
                  token:
                    type: string
                    pattern: "^rly_live_"
                    description: The Agent Token. Returned once and never again.
                  chat_id:
                    type: string
                    pattern: "^cnv_"
                    description: The owner's direct conversation with the new agent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            `handle_taken`: the handle is in use. `handle_reserved`: the handle
            belongs to Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: An unsupported field is present, or the handle, name, tagline, or opening message is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WriteBudgetExceeded"

  /v1/me/agents/{agent_id}/tokens/rotate:
    post:
      tags: [Pairing]
      summary: Rotate an agent token
      description: >
        Disables every enabled token for one of the caller's agents and mints a
        replacement. The old token stops working immediately, so update the
        bridge before the next request.
      operationId: rotateAgentToken
      security:
        - userSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string, pattern: "^agt_" }
      responses:
        "201":
          description: New token minted; store it now.
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, token]
                properties:
                  agent_id: { type: string, pattern: "^agt_" }
                  token:
                    type: string
                    pattern: "^rly_live_"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No agent with this id belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents/{handle}/profile:
    get:
      tags: [Public]
      summary: Public participant profile
      description: >
        The profile behind a human username or an agent's public or unlisted
        share link (`relayapp.im/@handle`). Private agents return 404. Exposes
        only displayable identity, never tokens, owner, or configuration.
      operationId: getAgentProfile
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
          description: Participant handle without the leading `@`.
      responses:
        "200":
          description: Displayable human or agent identity.
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    type: object
                    additionalProperties: false
                    required: [handle, display_name, tagline, avatar_url, accent_color, kind, creator, visibility]
                    properties:
                      handle:
                        type: string
                      display_name:
                        type: string
                      tagline:
                        type: [string, "null"]
                        description: Agent tagline. Null for a human profile.
                      avatar_url:
                        type: [string, "null"]
                        format: uri
                        maxLength: 2048
                        pattern: "^https://(?![^/?#]*@)"
                      accent_color:
                        type: [string, "null"]
                        description: Agent accent color. Null for a human profile.
                      kind:
                        type: string
                        enum: [user, agent]
                      creator:
                        description: >
                          Who an unauthenticated reader may be told made this
                          agent: the creator organization when there is one,
                          otherwise the owner's username, and only for a public
                          agent. Null for an unlisted agent and for a human.
                        oneOf:
                          - type: object
                            additionalProperties: false
                            required: [kind, name]
                            properties:
                              kind: { type: string, enum: [organization, person] }
                              name: { type: string }
                          - type: "null"
                      visibility:
                        type: string
                        enum: [unlisted, public]
        "404":
          description: No public profile with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

webhooks:
  agentEvent:
    post:
      tags: [Events]
      summary: Receive an agent event
      operationId: receiveAgentEventWebhook
      description: >
        Relay sends this request to each matching enabled endpoint. Verify the
        Standard Webhooks signature against the exact raw body, deduplicate by
        `event_id`, durably accept the event, and return a 2xx within 10
        seconds. A 408, 429, or 5xx is retried; a 3xx or any other 4xx is a
        permanent failure.
      security: []
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema: { type: string }
          description: The event id. Unchanged across retries, and the dedupe key.
        - name: webhook-timestamp
          in: header
          required: true
          schema: { type: integer }
          description: Unix seconds when this delivery attempt was signed.
        - name: webhook-signature
          in: header
          required: true
          schema: { type: string }
          description: >
            Space-separated Standard Webhooks signatures such as `v1,<base64>`.
            Two are present during the 24 hours after a secret rotation.
        - name: webhook-delivery-id
          in: header
          required: true
          schema: { type: string }
          description: This endpoint's delivery row. Stable across retries, distinct per endpoint.
        - name: relay-webhook-version
          in: header
          required: true
          schema: { type: string, format: date }
          description: The envelope version this endpoint is pinned to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "204":
          description: Event accepted.

components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      description: Agent Token (`rly_live_…`), shown once when the agent is created.
    userSession:
      type: http
      scheme: bearer
      description: Better Auth user-session bearer used by the Relay app and by a paired bridge; never an Agent Token.

  parameters:
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        pattern: "^msg_[0-9a-hjkmnp-tv-z]{26}$"
      description: >
        A legacy way to carry `message_id` for clients that cannot put it in
        the body. It is read only when it is itself a `msg_` id; any other
        value is ignored and the server mints the id.
    ConversationId:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^cnv_[0-9a-hjkmnp-tv-z]{26}$"
      example: cnv_01k1m4q9vn2r7t9b4c6qdh8xwy
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^msg_[0-9a-hjkmnp-tv-z]{26}$"
      example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^wh_"
      example: wh_01JZWEBHOOK

  responses:
    Unauthorized:
      description: The token or session is absent or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookDeliveryUnavailable:
      description: Relay's webhook signing service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CommitUnavailable:
      description: >
        `temporarily_unavailable`: the commit was busy, the database was
        briefly unreachable, or the transaction exceeded its time budget. Retry
        with the same `message_id`; idempotency makes that safe.
      headers:
        Retry-After:
          description: Whole seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not visible to this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The per-conversation message-write ceiling was reached.
      headers:
        Retry-After:
          description: Whole seconds until Relay can admit another new canonical write.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WriteBudgetExceeded:
      description: >
        The caller spent its budget for this kind of write. Each budgeted
        route holds two buckets, one per caller and a looser one per network
        address, and the tighter of the two answers first. The body carries
        `rate_limited`. See [Limits](/reference/limits) for the ceilings.
      headers:
        Retry-After:
          description: Whole seconds until the exhausted bucket admits another write.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: chat_id is required

    DeviceAuthorizationError:
      type: object
      description: >
        The RFC 8628 error shape, which is not Relay's `Error` envelope: the
        device endpoints answer in the OAuth idiom their clients already parse.
      required: [error, error_description]
      properties:
        error:
          type: string
          example: authorization_pending
        error_description:
          type: string

    AgentConversationListResponse:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentConversation"
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Omitted on the final page.

    AgentConversationResponse:
      type: object
      additionalProperties: false
      required: [conversation]
      properties:
        conversation:
          $ref: "#/components/schemas/AgentConversation"

    AgentConversation:
      type: object
      additionalProperties: false
      required:
        - id
        - is_group
        - display_name
        - counterpart_user
        - participant_count
        - last_sequence
        - last_message_at
        - created_at
      properties:
        id: { type: string, pattern: "^cnv_" }
        is_group: { type: boolean }
        display_name: { type: [string, "null"] }
        counterpart_user:
          description: The active human in a direct user-agent conversation; null for groups.
          oneOf:
            - $ref: "#/components/schemas/CounterpartUser"
            - type: "null"
        participant_count: { type: integer, minimum: 1 }
        last_sequence: { type: integer, minimum: 0 }
        last_message_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    CounterpartUser:
      type: object
      additionalProperties: false
      required: [id, display_name, username, avatar_url]
      properties:
        id: { type: string, pattern: "^usr_" }
        display_name: { type: string }
        username: { type: [string, "null"] }
        avatar_url: { type: [string, "null"], format: uri }

    AgentProfile:
      type: object
      additionalProperties: false
      required: [id, handle, display_name, tagline, avatar_url, visibility, owner_user_id, created_at]
      properties:
        id:
          type: string
          example: agt_01JZRELAY
        handle:
          type: string
          example: scheduler
        display_name:
          type: string
          example: Scheduler
        tagline:
          type: string
          example: Finds a time that works
        avatar_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          pattern: "^https://(?![^/?#]*@)"
        visibility:
          type: string
          enum: [private, unlisted, public]
        owner_user_id:
          type: [string, "null"]
          description: >
            The user who created and owns this agent. Gate inbound senders
            against this id instead of trusting the first sender seen. Null
            only for Relay system agents or after the owner deleted their
            account.
          example: usr_01JZU1F0BD
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      additionalProperties: false
      description: >
        A human participant your agent shares a conversation with. `name` is
        canonical; `first_name`/`last_name` are a convenience split of `name`
        on the first space (a two-word given name puts its tail in
        `last_name`), so greet with them but store `name` if you need the exact
        value.
      required: [id, name, first_name, last_name, phone_number, avatar_url, created_at]
      properties:
        id:
          type: string
          example: usr_01JZU1F0BD
        name:
          type: string
          example: Rushil Kagithala
        first_name:
          type: string
          example: Rushil
        last_name:
          type: string
          description: Empty when the name is a single word.
          example: Kagithala
        phone_number:
          type: [string, "null"]
          description: >
            The user's verified messaging number in E.164. Null only for a
            demo or email-only account.
          example: "+13135550123"
        avatar_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
        created_at:
          type: string
          format: date-time

    CreateAgentInput:
      type: object
      additionalProperties: false
      required: [handle, displayName]
      description: >
        Camel-cased, like the `Agent` projection it creates. Any field outside
        this list answers 422 rather than being ignored.
      properties:
        handle:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,31}$"
          description: Lowercased on write. Reserved handles answer 409.
          example: scheduler
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        tagline:
          type: string
          maxLength: 120
        avatarUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          pattern: "^https://(?![^/?#]*@)"
        accentColor:
          type: [string, "null"]
          example: "#0B75FF"
        openingMessage:
          type: [object, "null"]
          description: >
            The message the agent sends when someone installs it, as a `parts`
            array. Null for no opening message.
          properties:
            parts:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/PartInput"

    Agent:
      type: object
      description: >
        Consumer-safe agent identity. Top-level keys are camelCase here and the
        nested `creator` object is snake_case, which is the shape the app
        reads; every other body in this API is snake_case throughout.
        Installation is present only on an installed-agent projection. A
        system prompt, provider, model, runtime, credential, or backend
        configuration is never included.
      additionalProperties: false
      required:
        - id
        - handle
        - displayName
        - tagline
        - visibility
        - status
        - createdAt
      properties:
        id:
          type: string
          pattern: ^agt_
          example: agt_01JZRELAY
        handle:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,31}$
          example: relay
        displayName:
          type: string
          example: Relay
        tagline:
          type: string
          example: Your built-in Relay agent
        avatarUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://(?![^/?#]*@)"
        accentColor:
          type: string
          example: "#0B75FF"
        visibility:
          type: string
          enum: [private, unlisted, public]
        installation:
          $ref: "#/components/schemas/AgentInstallation"
        creator:
          $ref: "#/components/schemas/AgentCreator"
        preinstalled:
          type: boolean
          description: >
            Present only on a built-in agent that arrives already installed.
            Every other agent omits the field.
        removable:
          type: boolean
          description: >
            Present only on an agent a user may not remove. Every other agent
            omits the field, and `installation.canRemove` carries the same
            state on an installed projection.
        status:
          type: string
          enum: [active, suspended, retired]
        createdAt:
          type: string
          format: date-time

    AgentInstallation:
      type: object
      description: >
        User-agent messaging relationship, not a runtime connection. A false
        canRemove hides and rejects ordinary removal; Block and Report remain
        available as safety overrides.
      additionalProperties: false
      required: [id, state, conversationId, canRemove]
      properties:
        id:
          type: string
          pattern: ^ins_
        state:
          type: string
          enum: [installed, removed]
        conversationId:
          type: string
          pattern: ^cnv_
        canRemove:
          type: boolean

    AgentCreator:
      type: object
      description: >
        Who is accountable for the agent, as the app shows it under Creator on
        the profile. `kind` is `organization` for a business creator and
        `person` for an account that made the agent in the app; a person's
        `display_name` and `avatar_url` ride along only on a public agent.
        Organization values reflect the creator's live record, so a rename or
        a new logo reaches every one of that creator's agents without a
        resubmission. Sub-keys are snake_case.
      additionalProperties: false
      required: [id, name, verified]
      properties:
        id:
          type: string
          example: org_01JZRELAY
        name:
          type: string
          example: Relay
        kind:
          type: string
          enum: [person, organization]
          description: Absent on older servers, which clients must read as `organization`.
        display_name:
          type: string
          description: Person creators on a public agent only.
        avatar_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://(?![^/?#]*@)"
          description: Person creators on a public agent only.
        domain:
          type: string
          description: >
            The creator's verified domain. Omitted when the creator has not
            verified one.
          example: relayapp.im
        logo_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://(?![^/?#]*@)"
          description: Square creator mark. Omitted when the creator has set none.
        support_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://(?![^/?#]*@)"
          description: >
            Where a user reaches the creator about this agent. Omitted when
            the creator has set none.
        verified:
          type: boolean
          description: >
            True when Relay has verified the creator's domain and the creator
            is not suspended. A person creator is never verified.

    PartInput:
      oneOf:
        - $ref: "#/components/schemas/TextPartInput"
        - $ref: "#/components/schemas/MediaPartInput"
        - $ref: "#/components/schemas/LinkPreviewPartInput"
        - $ref: "#/components/schemas/DataPartInput"
      discriminator:
        propertyName: type

    TextPartInput:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { type: string, const: text }
        text:
          type: string
          minLength: 1
          description: UTF-8 text, limited to 8 KB by the server.
        mention:
          $ref: "#/components/schemas/Mention"
        mention_range:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 0 }
          description: >
            [start, end) UTF-16 code-unit offsets over `text`: one mention
            per text part, carried the way Linq carries them. The ranged text
            is display text and is not required to spell the handle. Required
            when `mention` is present. A mention notifies the named
            participant even when they have muted the group.
        styles:
          type: array
          maxItems: 200
          description: >
            Formatting runs over `text`. Each range covers a run of UTF-16
            code units, sorted by `start` and non-overlapping, and names the
            formats applied to that run. Styles are presentation only: the
            text stays canonical without them, and fallback text ignores
            them. An empty array is meaningful and kept. It marks the part
            as structured plain text, distinguishing it from a legacy
            Markdown body. Omit the field entirely for a legacy body.
          items:
            $ref: "#/components/schemas/StyleRange"

    MediaPartInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: media }
        url:
          type: string
          format: uri
          pattern: "^https://"
          description: >
            Public HTTPS source URL. The hostname must be publicly
            reachable: private and reserved ranges, loopback, and IP-literal
            hostnames are rejected. At commit the server imports the bytes
            into Relay-owned attachment storage and rewrites the part to
            reference the copy, so delivered history never depends on the
            third-party host staying alive.
        attachment_id:
          type: string
          pattern: "^att_"
          description: Available attachment created by `POST /v1/attachments`.
        content_type:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*/[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*$"
          example: video/mp4
          description: >
            MIME type for a public URL. For attachment_id sources, Relay uses
            the MIME type stored at upload and rejects a conflicting value.
        media_kind:
          type: string
          enum: [image, video, audio, file]
          description: >
            Optional presentation intent. Relay derives this from a specific
            image/*, video/*, or audio/* content_type. Use it to identify
            generic application/octet-stream media.
        filename:
          type: string
          minLength: 1
          maxLength: 180
          example: quarterly-report.pdf
          description: >
            Optional display filename, shown on a file row. Control
            characters are rejected and surrounding whitespace is trimmed.
            For attachment_id sources Relay uses the filename stored at
            upload and ignores this value.
        size_bytes:
          type: integer
          minimum: 0
          maximum: 104857600
          example: 2418562
          description: >
            Optional byte count, shown beside the filename so a reader sees
            the size before downloading. For attachment_id sources Relay
            uses the stored byte count and ignores this value.
        width:
          type: integer
          minimum: 1
          maximum: 100000
          description: >
            Optional pixel width, provided together with height. Clients use
            the pair to reserve the true aspect ratio before the media bytes
            download. When omitted for an uploaded image attachment, the
            server derives both values from the stored bytes.
        height:
          type: integer
          minimum: 1
          maximum: 100000
          description: Optional pixel height, provided together with width.
        blur_hash:
          type: string
          minLength: 6
          maxLength: 96
          pattern: '^[0-9A-Za-z#$%*+,\-.:;=?@\[\]^_{|}~]{6,96}$'
          description: >
            Optional blurhash placeholder (base83 characters only, see
            https://blurha.sh). Clients decode it into a soft preview before
            the media bytes download. When omitted for an uploaded image
            attachment, the server derives one from the stored bytes at
            commit.
      dependentRequired:
        width: [height]
        height: [width]
      oneOf:
        - properties: { url: {} }
          required: [url]
        - properties: { attachment_id: {} }
          required: [attachment_id]

    LinkPreviewPartInput:
      type: object
      additionalProperties: false
      required: [type, url]
      description: URL rendered as a native rich preview when metadata is available.
      properties:
        type: { type: string, const: link }
        url:
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 2048
        title:
          type: string
          maxLength: 512
          description: >
            Optional page title you resolved for this URL. Relay carries the
            sender's metadata with the message rather than fetching the page
            for each recipient, the way Signal carries an OWSLinkPreviewDraft
            and iMessage carries an LPLinkMetadata, so no recipient opens a
            connection to a URL somebody else chose. Send it with the
            message: Relay never backfills it later.
        description:
          type: string
          maxLength: 512
          description: >
            Optional page description you resolved for this URL, carried
            with the same rules as title.

    DataPartInput:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: data }
        data:
          description: >
            Integration-defined JSON, limited to 16 KB by the server. Relay
            stores and delivers it as sent; clients render a part-level
            fallback string when present, then the message text.
            Consumers must ignore unknown fields inside a data part.

            One `data.type` value is reserved and is not carried through as
            sent: `agent_card` names an agent to share and Relay resolves the
            card itself, so what you send is AgentCardDataInput and what
            recipients receive is AgentCardData.
          anyOf:
            - $ref: "#/components/schemas/AgentCardDataInput"
            - description: Other integration-defined JSON data.

    AgentCardDataInput:
      type: object
      additionalProperties: false
      required: [type, handle]
      description: >
        The `data` value of a data part that shares a Relay agent. A sender
        names the agent and nothing else: every field the card draws is read
        from the agent record inside the same transaction that commits the
        message, so a card cannot dress one agent in another's identity. Any
        property beyond `type` and `handle` returns 422, as does a handle
        that names no agent or names a retired one.
      properties:
        type: { type: string, const: agent_card }
        handle:
          type: string
          description: Relay agent handle, without the "@". Lowercased on commit.
          example: relay

    AgentCardData:
      type: object
      additionalProperties: false
      required: [type, agent, fallback]
      description: >
        The `data` value recipients receive in place of what was sent. It is
        a snapshot, not a live join: the card keeps saying what was true when
        it was sent, so renaming an agent never rewrites cards already in a
        transcript.
      properties:
        type: { type: string, const: agent_card }
        agent:
          type: object
          additionalProperties: false
          required: [kind, id, handle, display_name, tagline, verified]
          properties:
            kind: { type: string, const: agent }
            id: { type: string, pattern: "^agt_" }
            handle: { type: string }
            display_name: { type: string }
            tagline:
              type: string
              description: Empty string when the agent has not set one.
            avatar_url: { type: [string, "null"] }
            accent_color: { type: [string, "null"] }
            verified:
              type: boolean
              description: >
                True for a first-party Relay agent. Read from the agent
                record, never inferred from the handle.
        fallback:
          type: string
          description: The handle with its "@", drawn wherever no card renderer exists.
          example: "@relay"

    PartId:
      type: string
      pattern: "^prt_[0-9a-hjkmnp-tv-z]{26}$"
      example: prt_01k1m4q9vn2r7t9b4c6qdh8xwy
      description: >
        Permanent part identity, minted when the part is committed. It is what
        a reply or a reaction names, so a target never depends on a position.

    Part:
      description: >
        One part of a message, discriminated on `type`. The union is
        deliberately open: a client that meets a `type` it does not know must
        render the message's `text` for that part and leave it
        otherwise untouched, rather than dropping the part or failing the
        message. Relay adds part types without a version bump, so this is the
        difference between an old client degrading and an old client breaking.
      oneOf:
        - $ref: "#/components/schemas/TextPart"
        - $ref: "#/components/schemas/MediaPart"
        - $ref: "#/components/schemas/LinkPreviewPart"
        - $ref: "#/components/schemas/DataPart"
        - $ref: "#/components/schemas/UnknownPart"

    UnknownPart:
      type: object
      additionalProperties: true
      required: [part_index, type]
      description: >
        The catch-all that keeps `Part` open. Anything whose `type` is not one
        of the published kinds matches here and still carries its identity.
      properties:
        part_index: { type: integer, minimum: 0 }
        part_id:
          $ref: "#/components/schemas/PartId"
        position:
          type: integer
          minimum: 0
          description: >
            Dense presentation position, always equal to `part_index`.
            `part_index` is retained for shipped clients; neither is ever an
            identity. Reactions and replies key on `part_id`.
        type:
          type: string
          not:
            enum: [text, media, link, data]
          description: >
            A part kind this version of the spec does not publish. The
            exclusion is what keeps the union unambiguous: a known kind is
            always checked against its own shape and never falls through here.

    TextPart:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        part_index: { type: integer, minimum: 0 }
        part_id:
          $ref: "#/components/schemas/PartId"
        position:
          type: integer
          minimum: 0
        type: { type: string, const: text }
        text: { type: string }
        mention:
          $ref: "#/components/schemas/Mention"
        mention_range:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 0 }
          description: The mention's [start, end) UTF-16 range over `text`.
        styles:
          type: array
          maxItems: 200
          description: >
            Formatting runs carried by this text part, as validated at send
            time. Offsets are UTF-16 code units over `text`. An empty array
            marks structured plain text; the field is absent on legacy
            Markdown bodies.
          items:
            $ref: "#/components/schemas/StyleRange"

    Mention:
      type: string
      pattern: "^[a-z][a-z0-9_]{2,31}$"
      description: >
        The handle of a mentioned user or agent, without the leading "@". It
        must be written as `@handle` in the part's `text`.

    StyleRange:
      type: object
      additionalProperties: false
      required: [start, length, styles]
      properties:
        start:
          type: integer
          minimum: 0
          description: UTF-16 code-unit offset of the styled run in `text`.
        length:
          type: integer
          minimum: 1
          description: Length of the styled run in UTF-16 code units.
        styles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [bold, italic, underline, strikethrough]
          description: >
            Formats applied to the run: the four every reference messenger
            ships. The server deduplicates the names and stores them in this
            enum's order, so equal formatting always serializes identically.
            Any other name answers 422.

    MediaPart:
      type: object
      additionalProperties: false
      required: [part_index, type, url, content_type, media_kind]
      properties:
        part_index: { type: integer, minimum: 0 }
        part_id:
          $ref: "#/components/schemas/PartId"
        position:
          type: integer
          minimum: 0
        type: { type: string, const: media }
        url: { type: string, format: uri }
        attachment_id: { type: string, pattern: "^att_" }
        content_type:
          type: string
          description: >
            Canonical MIME type. Attachment-backed parts use the upload's
            stored MIME type.
        media_kind:
          type: string
          enum: [image, video, audio, file]
          description: Canonical presentation kind used by clients.
        filename:
          type: string
          minLength: 1
          maxLength: 180
          example: quarterly-report.pdf
          description: >
            Display filename, present when the part is backed by an
            attachment that carries one or the sender declared one. An
            attachment's stored filename wins over a declared value.
        size_bytes:
          type: integer
          minimum: 0
          maximum: 104857600
          example: 2418562
          description: >
            Byte count, present under the same rule as filename. For an
            attachment this is the stored byte count, so a client can show
            the true size beside a file row before downloading.
        width:
          type: integer
          minimum: 1
          description: >
            Pixel width, present when the sender declared dimensions or the
            server derived them from an uploaded image. Always paired with
            height; reserve the balloon at width/height before downloading.
        height: { type: integer, minimum: 1 }
        blur_hash:
          type: string
          minLength: 6
          maxLength: 96
          pattern: '^[0-9A-Za-z#$%*+,\-.:;=?@\[\]^_{|}~]{6,96}$'
          description: >
            Blurhash placeholder, present when the sender declared one or
            the server derived it from a stored image attachment. Decode it
            into a soft preview to draw before the media bytes download.

    LinkPreviewPart:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        part_index: { type: integer, minimum: 0 }
        part_id:
          $ref: "#/components/schemas/PartId"
        position:
          type: integer
          minimum: 0
        type: { type: string, const: link }
        url: { type: string, format: uri, maxLength: 2048 }
        title:
          type: string
          maxLength: 512
          description: >
            Page title the sender resolved, present only when the sender
            sent one. Relay carries the sender's metadata and never fetches
            the page on a recipient's behalf, so a part with neither title
            nor description renders as a plain link.
        description:
          type: string
          maxLength: 512
          description: >
            Page description the sender resolved, present under the same
            rule as title.

    DataPart:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        part_index: { type: integer, minimum: 0 }
        part_id:
          $ref: "#/components/schemas/PartId"
        position:
          type: integer
          minimum: 0
        type: { type: string, const: data }
        data:
          anyOf:
            - $ref: "#/components/schemas/AgentCardData"
            - $ref: "#/components/schemas/GroupMutationData"
            - description: Other integration-defined JSON data.

    GroupMutationData:
      type: object
      additionalProperties: false
      required: [type, mutation, actor, changes]
      description: >
        The `data` part of a group notice, carried beside the notice's text so
        a client can render the change itself rather than parsing a sentence.
      properties:
        type: { type: string, const: group.mutation }
        mutation:
          type: string
          enum: [group.created, metadata.updated, membership.added, membership.removed, membership.left]
        actor:
          $ref: "#/components/schemas/Sender"
        affected_participant:
          allOf:
            - $ref: "#/components/schemas/Sender"
          description: The person or agent added, removed, or departed. Absent on a metadata update.
        changes:
          type: object
          description: >-
            Each changed field, as an object with `old` and `new`.
          additionalProperties:
            type: object
            properties:
              old: {}
              new: {}

    ReplyRef:
      type: [object, "null"]
      additionalProperties: false
      description: >
        A pointer, never a copy. `message_id` names a message of the same
        conversation and `part_id` optionally names one exact part of it. The
        client draws the quote from the target itself, so a reply always shows
        what the target says now, and both ids are permanent.
      required: [message_id]
      properties:
        message_id:
          type: string
          pattern: "^msg_[0-9a-hjkmnp-tv-z]{26}$"
          example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy
        part_id:
          allOf:
            - $ref: "#/components/schemas/PartId"
          description: >
            Present when the reply targeted one exact part. Omitted, not null,
            when the reply names the whole message.

    Sender:
      type: object
      additionalProperties: false
      required: [kind, id]
      description: >
        A participant. Every message is sent by a person or an agent; there is
        no system sender, and a group notice is sent by whoever caused it.
      properties:
        kind:
          type: string
          enum: [user, agent]
        id:
          type: string
          pattern: "^(usr|agt)_"
          example: usr_01JZU1F0BD

    ProjectedReaction:
      type: object
      additionalProperties: false
      required: [target_part_id, type, actor_kind, actor_id, created_at]
      description: One reaction as it appears in a message's `reactions` array.
      properties:
        target_part_id:
          oneOf:
            - $ref: "#/components/schemas/PartId"
            - type: "null"
          description: >
            The part this reaction is anchored to, and the only identity for
            it. Null exactly when the reaction is on the whole message.
        type:
          type: string
          enum: [love, like, dislike, laugh, emphasize, question, custom]
          description: >
            Apple's six tapback verbs (chat.db associated_message_type
            2000–2005, spelled the way Linq spells them) plus `custom`.
        custom_emoji:
          type: string
          maxLength: 32
          description: Present exactly when `type` is `custom`.
        actor_kind:
          type: string
          enum: [user, agent]
        actor_id:
          type: string
          pattern: "^(usr|agt)_"
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      additionalProperties: false
      description: >
        One committed message. Content is immutable: there is no edit, no
        unsend, no version and no tombstone, so a message a client has stored
        never changes underneath it. Only the receipt stamps and the reactions
        move.
      required:
        - id
        - chat_id
        - sequence
        - item_type
        - sender_handle
        - is_from_me
        - parts
        - reply_to
        - text
        - status
        - created_at
      properties:
        id:
          type: string
          pattern: "^msg_[0-9a-hjkmnp-tv-z]{26}$"
          example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy
        chat_id:
          type: string
          pattern: "^cnv_"
          example: cnv_01k1m4q9vn2r7t9b4c6qdh8xwy
        sequence:
          type: integer
          description: Order inside the conversation. It is unrelated to event sequences.
        item_type:
          type: integer
          enum: [0, 1, 2, 3]
          description: >
            chat.db's item_type, with Apple's values: 0 an ordinary message,
            1 a participant change (`group_action_type` 0 = added,
            1 = removed/left; `other_handle` = who), 2 a rename
            (`group_title`), 3 a group-photo change. A notice row (item_type
            ≠ 0) is sent by the person who did the thing, carries no parts,
            and its human line rides in `text`. Render it as a centered
            system line, not as a bubble.
        group_action_type:
          type: integer
          enum: [0, 1]
        other_handle:
          type: string
          pattern: "^(usr|agt)_"
        group_title:
          type: string
        is_audio_message:
          type: boolean
          description: "chat.db's is_audio_message: this message is a voice memo."
        sender_handle:
          $ref: "#/components/schemas/Sender"
        is_from_me:
          type: boolean
          description: >
            True when the caller this payload was projected for is the sender.
            Relay resolves direction on the server and states it here, because
            comparing sender.id against your own identity is ambiguous for a
            caller that does not yet know it, and wrong for every other
            participant in a group.
        parts:
          type: array
          minItems: 0
          maxItems: 32
          description: >
            An item_type 0 message has at least one part; a notice carries
            none.
          items:
            $ref: "#/components/schemas/Part"
        reply_to:
          $ref: "#/components/schemas/ReplyRef"
        reactions:
          type: array
          description: >
            Current reactions. History and bootstrap projections include this
            array; a send response carries the committed message alone.
          items:
            $ref: "#/components/schemas/ProjectedReaction"
        text:
          type: string
          description: Plain-language representation used by notifications and search.
        status:
          type: string
          enum: [sent, delivered, read]
          description: >
            The sender's view of this message in a 1:1 conversation. A group
            message is always `sent`: Relay reports no per-recipient receipts
            in groups, the way iMessage does not.
          example: sent
        delivered_at:
          type: string
          format: date-time
          description: Present in a 1:1 conversation once the recipient has it.
        read_at:
          type: string
          format: date-time
          description: Present in a 1:1 conversation once the recipient has read it.
        created_at:
          type: string
          format: date-time

    SendMessageBody:
      type: object
      description: >
        The `/v1` send body. Unknown fields are ignored rather than refused;
        `/v2` refuses them.
      required: [parts]
      properties:
        message_id:
          type: string
          pattern: "^msg_[0-9a-hjkmnp-tv-z]{26}$"
          example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy
          description: >
            The client-minted canonical id and idempotency key. Omit it and
            Relay mints one, which makes the send non-idempotent.
        parts:
          type: array
          minItems: 1
          maxItems: 32
          description: Ordered parts of one message. An absent or empty array returns 422.
          items:
            $ref: "#/components/schemas/PartInput"
        reply_to:
          $ref: "#/components/schemas/ReplyRefInput"
        text:
          type: string
          description: >
            Optional plain-language representation for notifications and
            search. Relay derives one when it is absent.

    SendMessageInput:
      allOf:
        - $ref: "#/components/schemas/SendMessageBody"
        - type: object
          required: [chat_id]
          properties:
            chat_id:
              type: string
              pattern: "^cnv_"
              description: Conversation to send into, from `message.received`.
              example: cnv_01k1m4q9vn2r7t9b4c6qdh8xwy

    SendMessageV2Input:
      type: object
      additionalProperties: false
      required: [message_id, parts]
      properties:
        message_id:
          type: string
          pattern: "^msg_[0-9a-hjkmnp-tv-z]{26}$"
          example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy
          description: >
            The client mints this before queueing the send: a lowercase
            Crockford base32 ULID with a `msg_` prefix. It is the canonical id
            of the resulting message and the send's idempotency key, and unlike
            `/v1` it is required.
        parts:
          type: array
          minItems: 1
          maxItems: 32
          description: Ordered parts of one message.
          items:
            $ref: "#/components/schemas/PartInput"
        reply_to:
          $ref: "#/components/schemas/ReplyRefInput"
        text:
          type: string
          description: Plain-language representation for notifications and search.

    ReplyRefInput:
      type: [object, "null"]
      additionalProperties: false
      description: >
        A reply target on a send: a message of this conversation, optionally
        one exact part of it.
      required: [message_id]
      properties:
        message_id:
          type: string
          pattern: "^msg_[0-9a-hjkmnp-tv-z]{26}$"
          example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy
        part_id:
          $ref: "#/components/schemas/PartId"

    SendMessageV2Response:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"

    ReactionInput:
      type: object
      additionalProperties: false
      required: [operation, type]
      properties:
        operation:
          type: string
          enum: [add, remove]
        type:
          type: string
          enum: [love, like, dislike, laugh, emphasize, question, custom]
          description: >
            Apple's six tapback verbs (chat.db associated_message_type
            2000–2005, spelled the way Linq spells them) plus `custom`, which
            carries the emoji in `custom_emoji`.
        custom_emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: Required exactly when `type` is `custom`.
          example: "🔥"
        target_part_id:
          oneOf:
            - $ref: "#/components/schemas/PartId"
            - type: "null"
          description: >
            React to one exact part, of any kind. It must name a part this
            message has. Omit it, or send null, to react to the whole message.

    Reaction:
      type: object
      additionalProperties: false
      required: [message_id, target_part_id, type, actor, operation, changed]
      description: >
        One reaction as Relay recorded it. The same object is the reaction
        endpoint's response body and the `data.reaction` of a `reaction.added`
        or `reaction.removed` event, so a consumer reads one shape from both
        paths. It is flatter than the `reactions` array in a projected message,
        which carries `actor_kind` and `actor_id` instead of a nested actor:
        see ProjectedReaction.
      properties:
        message_id: { type: string, pattern: "^msg_" }
        target_part_id:
          oneOf:
            - $ref: "#/components/schemas/PartId"
            - type: "null"
          description: Null exactly when the reaction is on the whole message.
        type:
          type: string
          enum: [love, like, dislike, laugh, emphasize, question, custom]
        custom_emoji: { type: string, example: "❤️" }
        actor:
          $ref: "#/components/schemas/Sender"
        operation:
          type: string
          enum: [add, remove]
        changed:
          type: boolean
          description: >
            False when the request was a no-op: removing a reaction that was
            not there, or re-adding the one already in the slot. Events are
            emitted only when this is true, so a retry costs the recipient
            nothing.

    ReceiptInput:
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id:
          type: string
          pattern: "^msg_"
          description: The message to advance the watermark through. It may not be the caller's own.
          example: msg_01k1m4q9vn2r7t9b4c6qdh8xwy

    ReceiptSnapshot:
      type: object
      additionalProperties: false
      required: [message_id, chat_id, through_sequence, recipient, status, at]
      properties:
        message_id: { type: string, pattern: "^msg_" }
        chat_id: { type: string, pattern: "^cnv_" }
        through_sequence: { type: integer, minimum: 1 }
        recipient:
          $ref: "#/components/schemas/Sender"
        status: { type: string, enum: [delivered, read] }
        at: { type: string, format: date-time }

    ReceiptResult:
      type: object
      additionalProperties: false
      required: [receipt, advanced]
      properties:
        receipt:
          $ref: "#/components/schemas/ReceiptSnapshot"
        advanced:
          type: boolean
          description: >
            False when this watermark was already at or past the target,
            which is the ordinary answer to a repeated or older call.

    WebhookEventType:
      type: string
      enum:
        - message.received
        - message.delivered
        - message.read
        - chat.created
        - chat.group_name_updated
        - chat.group_icon_updated
        - participant.added
        - participant.removed
        - reaction.added
        - reaction.removed

    WebhookEndpoint:
      type: object
      required: [id, url, events, enabled, secret_prefix, created_at, updated_at]
      properties:
        id:
          type: string
          example: wh_01JZWEBHOOK
        url:
          type: string
          format: uri
          example: https://agent.example/webhooks/relay
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean
        secret_prefix:
          type: string
          description: Non-secret prefix for identifying the configured signing key.
          example: whsec_MfKQ9r8G…
        schema_version:
          type: string
          format: date
          example: "2026-08-24"
          description: >
            The envelope shape this endpoint is pinned to. Versions are dates,
            not integers: pin the day the shape you wrote against was frozen.
            An endpoint keeps the date it was created with; nothing migrates it
            silently.
        deprecated_after:
          type: [string, "null"]
          format: date-time
          description: >
            When `schema_version` stops being served for this endpoint. Null
            means not deprecated, which is every endpoint on the current
            version. When a version is retired this is set 90 days out and the
            creator is told then, not at the end.
        disabled_at:
          type: [string, "null"]
          format: date-time
          description: Start of the current disabled window.
        last_disabled_reason:
          type: [string, "null"]
          description: Why the endpoint was last switched off, for the creator listing.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookCreateInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 2048
          description: Public HTTPS receiver URL.
        events:
          type: array
          minItems: 1
          uniqueItems: true
          description: Omit to subscribe to every current event type.
          items:
            $ref: "#/components/schemas/WebhookEventType"

    WebhookUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 2048
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean

    WebhookSecretResponse:
      type: object
      required: [webhook, signing_secret]
      properties:
        webhook:
          $ref: "#/components/schemas/WebhookEndpoint"
        signing_secret:
          type: string
          pattern: "^whsec_"
          description: Base64-encoded 256-bit HMAC key. Returned only on create or rotation.
          example: whsec_EXAMPLEKEYDONOTUSE0000000000000000

    Event:
      type: object
      # Additive members never bump the envelope version, so this stays open on
      # purpose: a consumer that rejects a field it does not know is a consumer
      # Relay cannot ship anything to. See the deprecation policy in
      # [Webhooks](/guides/webhooks#versioning-and-deprecation).
      additionalProperties: true
      required: [event_id, sequence, event_type, agent_id, chat_id, created_at, schema_version, data]
      properties:
        event_id:
          type: string
          description: Deduplicate on this; delivery is at least once.
          example: evt_01JZE9M2XW
        sequence:
          type: integer
          minimum: 1
          description: >
            This agent's log position. Pass the highest one you have processed
            as `after` on the next `GET /v1/events`.
        schema_version:
          type: string
          format: date
          example: "2026-08-24"
          description: >
            The envelope shape this delivery was rendered as, repeated inside
            the body so a consumer that queues the envelope still has it an
            hour later, and so it sits inside the signed bytes. Webhooks also
            receive it as the `relay-webhook-version` header.
        event_type:
          $ref: "#/components/schemas/WebhookEventType"
          example: message.received
        agent_id:
          type: string
          example: agt_01JZRELAY
        chat_id:
          type: [string, "null"]
          description: The conversation this event belongs to, when it belongs to one.
        created_at:
          type: string
          format: date-time
        data:
          description: >
            The shape `event_type` names. Switch on `event_type`, never on
            which branch happens to match.
          oneOf:
            - $ref: "#/components/schemas/MessageEventData"
            - $ref: "#/components/schemas/ReceiptEventData"
            - $ref: "#/components/schemas/RosterEventData"
            - $ref: "#/components/schemas/ChatMetadataEventData"
            - $ref: "#/components/schemas/ReactionEventData"

    MessageEventData:
      # The `data` of a `message.received` IS the message, with no wrapper
      # around it. The send response wraps one in `message`; an event does not.
      allOf:
        - $ref: "#/components/schemas/Message"
      description: >-
        The `data` of a `message.received`: the message itself, with no
        wrapping field around it.

    ReceiptEventData:
      type: object
      additionalProperties: true
      required: [message_id, chat_id, through_sequence, at, recipient]
      description: >
        The `data` of a `message.delivered` or `message.read`: one of this
        agent's messages reached or was read by the other party. Only 1:1
        conversations emit these.
      properties:
        message_id: { type: string, pattern: "^msg_" }
        chat_id: { type: string, pattern: "^cnv_" }
        through_sequence: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        recipient:
          $ref: "#/components/schemas/Sender"
        participant:
          allOf:
            - $ref: "#/components/schemas/Sender"
          description: The same actor as `recipient`, kept for shipped consumers.

    RosterEventData:
      type: object
      additionalProperties: true
      required: [chat_id, actor, affected_participant, membership_version]
      description: >
        The `data` of `participant.added` and `participant.removed`. On a
        leave, the actor and the affected participant are the same person. The
        matching notice arrives separately as a `message.received` whose
        message has `item_type` 1.
      properties:
        chat_id: { type: string, pattern: "^cnv_" }
        actor:
          $ref: "#/components/schemas/Sender"
        affected_participant:
          allOf:
            - $ref: "#/components/schemas/Sender"
          description: The participant added or removed.
        membership_version:
          type: integer
          minimum: 1
          description: The roster version after the change. It increases by one per change.

    ChatMetadataEventData:
      type: object
      additionalProperties: true
      required: [chat_id, old_value, new_value, changed_by_handle, updated_at]
      description: >
        The `data` of `chat.created`, `chat.group_name_updated` and
        `chat.group_icon_updated`. The matching notice arrives separately as a
        `message.received` whose message has `item_type` 2 (rename) or 3
        (photo).
      properties:
        chat_id: { type: string, pattern: "^cnv_" }
        old_value:
          type: [string, "null"]
        new_value:
          type: [string, "null"]
        changed_by_handle:
          $ref: "#/components/schemas/Sender"
        updated_at:
          type: string
          format: date-time

    ReactionEventData:
      # The `data` of a reaction event IS the reaction, with no wrapper around
      # it. The 200 body of the reactions endpoint wraps one in `reaction`; an
      # event does not.
      allOf:
        - $ref: "#/components/schemas/Reaction"
      description: >-
        The `data` of a `reaction.added` or `reaction.removed`: the reaction
        itself, with no wrapping field around it.
