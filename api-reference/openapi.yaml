openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Relay Developer API
  version: 1.0.0-local
  summary: Webhook-only inbound delivery and idempotent REST writes for Relay agents.
  description: |
    Proposed local v1 replacement contract. Developer inbound events are delivered only
    through signed webhooks. No event polling, long polling, SSE, WebSocket, or agent sync
    route is part of this API. All named schemas use object version 2026-08-28.
servers:
  - url: http://127.0.0.1:8788
    description: Local Relay server
security:
  - AgentBearer: []
tags:
  - name: Agents
  - name: Identities
  - name: Chats
  - name: Messages
  - name: Attachments
  - name: Webhooks
paths:
  /v1/agents/me:
    get:
      tags:
        - Agents
      operationId: getAuthenticatedAgent
      summary: Get the authenticated agent identity.
      responses:
        "200":
          description: Authenticated agent.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentIdentity"
              examples:
                default:
                  $ref: "#/components/examples/AgentIdentityExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/identities/{identity_id}:
    parameters:
      - $ref: "#/components/parameters/IdentityId"
    get:
      tags:
        - Identities
      operationId: getIdentity
      summary: Get an identity visible through an active shared chat.
      responses:
        "200":
          description: Visible human or agent identity.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/chats:
    get:
      tags:
        - Chats
      operationId: listChats
      summary: List chats in which the authenticated agent is currently active.
      description: Resource discovery only; this is not an inbound event or recovery feed.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page ordered by most recent canonical chat activity, then chat ID.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/chats/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    get:
      tags:
        - Chats
      operationId: getChat
      summary: Get one chat and current membership.
      responses:
        "200":
          description: Chat resource.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/chats/{chat_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      tags:
        - Messages
      operationId: sendMessage
      summary: Accept one immutable message with ordered parts.
      description: |
        One request creates at most one message. HTTP 202 confirms canonical acceptance,
        not delivery or read. Reuse the same Idempotency-Key and exact body for retries.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            examples:
              multipartReply:
                externalValue: ./examples/send-message.request.json
      responses:
        "202":
          description: Message accepted and persisted.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
              examples:
                accepted:
                  externalValue: ./examples/send-message.response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags:
        - Messages
      operationId: listChatMessages
      summary: List canonical message history for reconciliation.
      description: Side-effect-free newest-first resource history. It has no wait parameter, performs no delivery/read stamping, and returns an opaque history-page cursor rather than an inbound event cursor. Webhooks remain the only developer inbound-activity transport.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Newest-first message page; next_cursor continues toward older history.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
              examples:
                history:
                  externalValue: ./examples/list-chat-messages.response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      tags:
        - Messages
      operationId: getMessage
      summary: Get one known message by stable ID.
      description: Fetch one stable resource directly. Chat history reconciliation uses GET /v1/chats/{chat_id}/messages; neither route is an inbound event feed.
      responses:
        "200":
          description: Message resource.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/messages/{message_id}/reactions:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags:
        - Messages
      operationId: changeReaction
      summary: Set/replace or remove the agent reaction in an exact target slot.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionChangeRequest"
            examples:
              setExactPart:
                externalValue: ./examples/set-reaction.request.json
      responses:
        "200":
          description: Canonical reaction slot result; repeated final state is a no-op.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionChangeResponse"
              examples:
                result:
                  externalValue: ./examples/set-reaction.response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/chats/{chat_id}/read:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      tags:
        - Messages
      operationId: markChatRead
      summary: Advance the agent's monotonic read boundary through one message.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
            examples:
              throughMessage:
                externalValue: ./examples/mark-read.request.json
      responses:
        "200":
          description: Current receipt boundary; older/repeated targets are successful no-ops.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkReadResponse"
              examples:
                result:
                  externalValue: ./examples/mark-read.response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/attachments:
    post:
      tags:
        - Attachments
      operationId: createAttachment
      summary: Allocate a durable attachment and raw upload target.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
            examples:
              image:
                externalValue: ./examples/create-attachment.request.json
      responses:
        "201":
          description: Attachment allocation. Upload expires in 15 minutes.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAttachmentResponse"
              examples:
                allocated:
                  externalValue: ./examples/create-attachment.response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags:
        - Attachments
      operationId: getAttachment
      summary: Get attachment metadata and lifecycle state.
      responses:
        "200":
          description: Attachment metadata.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Attachments
      operationId: deleteAttachment
      summary: Delete an unreferenced attachment allocation and bytes.
      description: Committed message ownership returns attachment_in_use and bytes remain immutable.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "204":
          description: Attachment is absent/deleted.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/attachments/{attachment_id}/content:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    put:
      tags:
        - Attachments
      operationId: uploadAttachmentContent
      summary: Upload exact raw bytes to an allocated attachment.
      description: Byte-identical retries return the same resource; different bytes conflict.
      parameters:
        - $ref: "#/components/parameters/ContentLength"
        - $ref: "#/components/parameters/OptionalContentSha256"
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              contentEncoding: binary
      responses:
        "200":
          description: Attachment content is available.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            ETag:
              $ref: "#/components/headers/ETag"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
              examples:
                available:
                  externalValue: ./examples/upload-attachment.response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags:
        - Attachments
      operationId: downloadAttachmentContent
      summary: Download attachment bytes, optionally by one byte range.
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: Complete attachment bytes.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Length:
              $ref: "#/components/headers/ResponseContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        "206":
          description: Requested byte range.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Length:
              $ref: "#/components/headers/ResponseContentLength"
            Content-Range:
              $ref: "#/components/headers/ContentRange"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      tags:
        - Attachments
      operationId: headAttachmentContent
      summary: Inspect available attachment representation headers.
      responses:
        "200":
          description: Content metadata without bytes.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Length:
              $ref: "#/components/headers/ResponseContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhook-events:
    get:
      tags:
        - Webhooks
      operationId: listWebhookEventTypes
      summary: List event types supported by webhook version 2026-08-28.
      responses:
        "200":
          description: Static event catalog.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhook-subscriptions:
    get:
      tags:
        - Webhooks
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Subscription page; signing secrets are never returned.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Webhooks
      operationId: createWebhookSubscription
      summary: Create a version-pinned webhook subscription.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookSubscriptionRequest"
            examples:
              localAgent:
                externalValue: ./examples/create-webhook-subscription.request.json
      responses:
        "201":
          description: Subscription plus one-time signing secret.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWebhookSubscriptionResponse"
              examples:
                created:
                  externalValue: ./examples/create-webhook-subscription.response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhook-subscriptions/{subscription_id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags:
        - Webhooks
      operationId: getWebhookSubscription
      summary: Get one webhook subscription without its secret.
      responses:
        "200":
          description: Subscription resource.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Webhooks
      operationId: updateWebhookSubscription
      summary: Update target, filter, or enabled state without changing version.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookSubscriptionRequest"
      responses:
        "200":
          description: Updated subscription and new start boundary when re-enabled.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Webhooks
      operationId: deleteWebhookSubscription
      summary: Stop future deliveries and automatic attempts.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "204":
          description: Subscription is absent/deleted; retained delivery audit expires normally.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhook-subscriptions/{subscription_id}/secret/rotate:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      tags:
        - Webhooks
      operationId: rotateWebhookSigningSecret
      summary: Rotate the Standard Webhooks secret with overlap.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWebhookSecretRequest"
      responses:
        "200":
          description: One-time new secret and overlap deadline.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateWebhookSecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhook-subscriptions/{subscription_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags:
        - Webhooks
      operationId: listWebhookDeliveries
      summary: List delivery metadata for operation and redrive.
      description: This control-plane page never returns webhook event bodies.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WebhookDeliveryStatus"
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Delivery metadata page ordered newest first, then delivery ID.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhook-subscriptions/{subscription_id}/deliveries/{delivery_id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/DeliveryId"
    get:
      tags:
        - Webhooks
      operationId: getWebhookDelivery
      summary: Get delivery metadata and attempt history without event body.
      responses:
        "200":
          description: Delivery metadata.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
              examples:
                deadLetter:
                  externalValue: ./examples/dead-letter-delivery.response.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhook-subscriptions/{subscription_id}/deliveries/{delivery_id}/redrive:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/DeliveryId"
    post:
      tags:
        - Webhooks
      operationId: redriveWebhookDelivery
      summary: Start one new attempt cycle for a dead-letter delivery.
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "202":
          description: Redrive accepted; event/body/delivery IDs remain unchanged.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
              examples:
                retrying:
                  externalValue: ./examples/redrive-delivery.response.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/chats/{chat_id}/typing:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      tags:
        - Chats
      operationId: startTyping
      summary: Start or refresh the agent typing indicator.
      description: State-idempotent ephemeral signal with a 90-second TTL. It is never a transcript message or chat_sequence entry.
      responses:
        "204":
          description: Typing is active/refreshed; a typing.started event is emitted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Chats
      operationId: stopTyping
      summary: Stop the agent typing indicator.
      description: State-idempotent. Clearing an absent/expired indicator succeeds and emits no duplicate state change.
      responses:
        "204":
          description: Typing is inactive; typing.stopped is emitted only on a state change.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
webhooks:
  eventDelivery:
    post:
      summary: Relay event delivery to a registered target URL.
      description: Verify Standard Webhooks headers against exact raw body before parsing.
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: webhook-timestamp
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: webhook-signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^v1,[A-Za-z0-9+/=]+(?: v1,[A-Za-z0-9+/=]+)*$"
        - name: webhook-delivery-id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: relay-webhook-version
          in: header
          required: true
          schema:
            const: 2026-08-28
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./webhooks.schema.json
      responses:
        "200":
          description: Delivery durably accepted by consumer.
        "204":
          description: Delivery durably accepted by consumer with no response body.
        "400":
          description: Malformed or unsupported delivery; no automatic retry.
        "401":
          description: Signature or timestamp verification failed; no automatic retry.
        "429":
          description: Consumer requests a retry; Retry-After may be honored.
        "500":
          description: Consumer failed; Relay retries according to delivery policy.
components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: Relay agent API key
  parameters:
    IdentityId:
      name: identity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatId:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the preceding page; bound to normalized filters.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[A-Za-z0-9._:-]+$
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[A-Za-z0-9._:-]+$
    ContentLength:
      name: Content-Length
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 104857600
    OptionalContentSha256:
      name: X-Content-SHA256
      in: header
      required: false
      description: Lowercase hexadecimal SHA-256 of exact upload bytes.
      schema:
        type: string
        pattern: ^[a-f0-9]{64}$
    Range:
      name: Range
      in: header
      required: false
      description: One RFC 9110 bytes range; multipart ranges are unsupported.
      schema:
        type: string
        pattern: ^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$
  headers:
    TraceId:
      description: W3C-compatible 16-byte trace ID encoded as lowercase hex.
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    IdempotencyReplayed:
      description: Present and true when Relay replayed a completed command result.
      schema:
        type: boolean
    RetryAfter:
      description: Whole seconds before retry.
      schema:
        type: integer
        minimum: 0
    ETag:
      description: Quoted SHA-256 representation validator.
      schema:
        type: string
    AcceptRanges:
      schema:
        const: bytes
    ResponseContentLength:
      schema:
        type: integer
        minimum: 0
    ContentRange:
      schema:
        type: string
        pattern: ^bytes [0-9]+-[0-9]+/[0-9]+$
  responses:
    BadRequest:
      description: Malformed request.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated principal is not allowed to perform the operation.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource is absent or not visible.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency conflict, in-progress command, or invalid resource state.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Upload allocation expired.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request exceeds a documented size/count limit.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Declared or sniffed media is unsupported.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RangeNotSatisfiable:
      description: Byte range is outside the attachment representation.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
        Content-Range:
          description: Unsatisfied range form.
          schema:
            type: string
            pattern: ^bytes \*/[0-9]+$
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Schema-valid framing with invalid fields or domain references.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate or send budget exceeded.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Temporary overload or dependency outage.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
