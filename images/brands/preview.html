<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay docs brand marks</title>
<style>
  body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: #111; background: #f6f6f7; margin: 0; padding: 32px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p { color: #555; margin: 0 0 24px; }
  .sheet { display: inline-block; background: #fff; border: 1px solid #e3e3e6;
           border-radius: 10px; overflow: hidden; }
  .head, .row { display: flex; align-items: center; }
  .head { border-bottom: 1px solid #e3e3e6; color: #666; font-size: 12px;
          text-transform: uppercase; letter-spacing: .04em; }
  .head div { padding: 10px 0; text-align: center; }
  .head .name { text-align: left; padding-left: 16px; }
  .row + .row { border-top: 1px solid #f0f0f2; }
  .name { width: 200px; padding-left: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .cell { width: 140px; height: 96px; display: flex; align-items: center; justify-content: center; }
  .light { background: #fff; }
  .dark { background: #0B0B0C; }
  img { width: 48px; height: 48px; object-fit: contain; }
</style>
</head>
<body>
  <h1>Relay docs brand marks</h1>
  <p>Every file in images/brands at 48 px, on white and on #0B0B0C. Not linked from the site.</p>
  <div class="sheet">
    <div class="head">
      <div class="name">File</div>
      <div class="cell">White</div>
      <div class="cell">#0B0B0C</div>
    </div>
    <div class="row">
      <div class="name">anthropic.svg</div>
      <div class="cell light"><img src="anthropic.svg" alt="anthropic.svg"></div>
      <div class="cell dark"><img src="anthropic.svg" alt="anthropic.svg"></div>
    </div>
    <div class="row">
      <div class="name">claude.svg</div>
      <div class="cell light"><img src="claude.svg" alt="claude.svg"></div>
      <div class="cell dark"><img src="claude.svg" alt="claude.svg"></div>
    </div>
    <div class="row">
      <div class="name">cline.svg</div>
      <div class="cell light"><img src="cline.svg" alt="cline.svg"></div>
      <div class="cell dark"><img src="cline.svg" alt="cline.svg"></div>
    </div>
    <div class="row">
      <div class="name">cursor.svg</div>
      <div class="cell light"><img src="cursor.svg" alt="cursor.svg"></div>
      <div class="cell dark"><img src="cursor.svg" alt="cursor.svg"></div>
    </div>
    <div class="row">
      <div class="name">gemini.svg</div>
      <div class="cell light"><img src="gemini.svg" alt="gemini.svg"></div>
      <div class="cell dark"><img src="gemini.svg" alt="gemini.svg"></div>
    </div>
    <div class="row">
      <div class="name">hermes.png</div>
      <div class="cell light"><img src="hermes.png" alt="hermes.png"></div>
      <div class="cell dark"><img src="hermes.png" alt="hermes.png"></div>
    </div>
    <div class="row">
      <div class="name">linq.png</div>
      <div class="cell light"><img src="linq.png" alt="linq.png"></div>
      <div class="cell dark"><img src="linq.png" alt="linq.png"></div>
    </div>
    <div class="row">
      <div class="name">openai.svg</div>
      <div class="cell light"><img src="openai.svg" alt="openai.svg"></div>
      <div class="cell dark"><img src="openai.svg" alt="openai.svg"></div>
    </div>
    <div class="row">
      <div class="name">openclaw.svg</div>
      <div class="cell light"><img src="openclaw.svg" alt="openclaw.svg"></div>
      <div class="cell dark"><img src="openclaw.svg" alt="openclaw.svg"></div>
    </div>
    <div class="row">
      <div class="name">opencode.svg</div>
      <div class="cell light"><img src="opencode.svg" alt="opencode.svg"></div>
      <div class="cell dark"><img src="opencode.svg" alt="opencode.svg"></div>
    </div>
    <div class="row">
      <div class="name">photon.svg</div>
      <div class="cell light"><img src="photon.svg" alt="photon.svg"></div>
      <div class="cell dark"><img src="photon.svg" alt="photon.svg"></div>
    </div>
    <div class="row">
      <div class="name">telegram.svg</div>
      <div class="cell light"><img src="telegram.svg" alt="telegram.svg"></div>
      <div class="cell dark"><img src="telegram.svg" alt="telegram.svg"></div>
    </div>
    <div class="row">
      <div class="name">vercel.svg</div>
      <div class="cell light"><img src="vercel.svg" alt="vercel.svg"></div>
      <div class="cell dark"><img src="vercel.svg" alt="vercel.svg"></div>
    </div>
    <div class="row">
      <div class="name">vscode.svg</div>
      <div class="cell light"><img src="vscode.svg" alt="vscode.svg"></div>
      <div class="cell dark"><img src="vscode.svg" alt="vscode.svg"></div>
    </div>
  </div>
</body>
</html>
