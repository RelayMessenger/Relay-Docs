name: Production deploy

# The production twin of preview.yml and staging-edge.yml. It runs every gate
# those two run, then publishes the Mintlify production project behind
# docs.relayapp.im and the Cloudflare Worker that fronts it. Nothing is
# published unless every gate passed first, and a failed gate leaves the live
# site exactly as it was.
#
# The edge Worker is deployed before the Mintlify project on purpose. The
# Worker owns the hostname, so a hostname or credential fault fails there,
# while the site is still untouched. The Worker serves llms.txt and
# llms-full.txt from this commit and proxies every other path to Mintlify, so
# the only skew between the two steps is a summary file that is newer than the
# pages for the length of one Mintlify build.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit to validate and deploy
        required: false
        type: string
      dry_run:
        description: Run every gate, then stop before publishing anything
        required: false
        default: false
        type: boolean

concurrency:
  group: relay-docs-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  gates:
    # Called, not copied. A production gate that repeats validate.yml's steps
    # drifts from them the first time one of them changes.
    name: Docs gates
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Publish the docs site and its LLM edge
    needs: gates
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    timeout-minutes: 35
    env:
      DOCS_ORIGIN: https://docs.relayapp.im
      PRODUCTION_WORKER: relay-docs-llms-production
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - name: Pin the release commit
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$(printf '%s' "$RELEASE_SHA" | wc -c | tr -d ' ')" = 40
          test -z "$(git status --porcelain)"
          # A dry run is a rehearsal and may run from any branch. Anything that
          # publishes must be a commit that is already on main.
          if [ "$DRY_RUN" != "true" ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          fi
          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA" >> "$GITHUB_ENV"

      # /ci/server holds the least-privilege Cloudflare deploy token. The
      # /ci/website credential is scoped to Pages and cannot publish a Worker
      # script, which is why staging-edge.yml reads this path too.
      - name: Load production Cloudflare deploy credentials
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: 35c5afed-649f-4b2d-8e73-cf70338b3994
          project-slug: relay-yscy
          env-slug: prod
          secret-path: /ci/server

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # preview.yml's gate for the site and staging-edge.yml's gate for the
      # edge in one command: `npm run validate` ends with `check:llms-edge`.
      - run: npm run validate

      - name: Report every credential this deploy reads
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PRODUCTION_PROJECT_ID: ${{ vars.MINTLIFY_PRODUCTION_PROJECT_ID }}
        run: |
          set -euo pipefail
          {
            echo "## Production credentials"
            echo
            echo "| Name | Source | State |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          missing=0
          report() {
            if [ -n "${2:-}" ]; then
              echo "| \`$1\` | $3 | present |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$1\` | $3 | MISSING |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$1 is empty. The production deploy needs it."
              missing=1
            fi
          }
          report CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}" "Infisical prod /ci/server"
          report CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID:-}" "Infisical prod /ci/server"
          report MINTLIFY_API_KEY "${MINTLIFY_API_KEY:-}" "GitHub environment secret"
          report MINTLIFY_PRODUCTION_PROJECT_ID "${MINTLIFY_PRODUCTION_PROJECT_ID:-}" "GitHub environment variable"
          # A rehearsal reports what is missing. A deploy refuses on it.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: credentials reported, not required."
            exit 0
          fi
          exit "$missing"

      - name: Bundle the production Worker without publishing it
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run \
            --config edge/llms-proxy/wrangler.jsonc \
            --env production \
            --outdir .wrangler/dry-run-production

      - name: Stop here on a dry run
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Dry run"
            echo
            echo "Every gate ran and the production Worker bundled."
            echo "Nothing was published to \`$DOCS_ORIGIN\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a hostname that belongs to another Worker
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # docs.relayapp.im is a CNAME to Mintlify until the hostname moves to
          # this Worker. wrangler creates the custom domain on the first deploy,
          # but it cannot take a hostname a different Worker already holds, and
          # discovering that mid-deploy would leave the site half-published.
          domains="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          holder="$(jq -r \
            --arg hostname "docs.relayapp.im" \
            '[.result[] | select(.hostname == $hostname) | .service][0] // ""' \
            <<< "$domains")"
          if [ -n "$holder" ] && [ "$holder" != "$PRODUCTION_WORKER" ]; then
            echo "::error::docs.relayapp.im is a custom domain of $holder, not $PRODUCTION_WORKER. Nothing was published."
            exit 1
          fi
          if [ -z "$holder" ]; then
            echo "::notice::docs.relayapp.im is not a Worker custom domain yet. This deploy creates it, and it fails while the Mintlify CNAME still holds the hostname."
          fi

      - name: Deploy the production LLM edge
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config edge/llms-proxy/wrangler.jsonc \
            --env production \
            --message "GitHub $RELEASE_SHA"

      - name: Deploy the Mintlify production project
        if: env.DRY_RUN != 'true'
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PRODUCTION_PROJECT_ID: ${{ vars.MINTLIFY_PRODUCTION_PROJECT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://api.mintlify.com/v1/project/update/$MINTLIFY_PRODUCTION_PROJECT_ID" \
            -H "Authorization: Bearer $MINTLIFY_API_KEY")

          status_id=$(python3 -c \
            'import json, sys; print(json.loads(sys.argv[1])["statusId"])' \
            "$response")

          for attempt in $(seq 1 90); do
            status_response=$(curl --fail-with-body --silent --show-error \
              "https://api.mintlify.com/v1/project/update-status/$status_id" \
              -H "Authorization: Bearer $MINTLIFY_API_KEY")
            deployment_status=$(python3 -c \
              'import json, sys; print(json.load(sys.stdin)["status"])' \
              <<< "$status_response")

            case "$deployment_status" in
              success) break ;;
              failure)
                printf '%s\n' "$status_response"
                exit 1
                ;;
              queued|in_progress) sleep 10 ;;
              *)
                echo "Unknown Mintlify deployment status: $deployment_status"
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 90 ]; then
              echo "Mintlify production deployment timed out."
              exit 1
            fi
          done
          printf 'MINTLIFY_STATUS_ID=%s\n' "$status_id" >> "$GITHUB_ENV"

      - name: Verify the canonical production files
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          expected="$(sha256sum llms-full.txt | cut -d' ' -f1)"
          headers="$RUNNER_TEMP/llms-full.headers"
          body="$RUNNER_TEMP/llms-full.txt"
          curl -fsS -D "$headers" -o "$body" "$DOCS_ORIGIN/llms-full.txt"
          test "$(sha256sum "$body" | cut -d' ' -f1)" = "$expected"
          grep -Fqi "cache-control: no-store, max-age=0" "$headers"
          grep -Fqi "x-relay-docs-proxy: cloudflare-production" "$headers"
          grep -Fqi "x-relay-docs-source: $expected" "$headers"
          ! grep -Fqi "greeting_message" "$body"
          grep -Fq "/v1/contact_requests" "$body"
          # The proxy passes every other path to Mintlify, so the root proves
          # the site itself is being served through this Worker.
          root_headers="$RUNNER_TEMP/root.headers"
          curl -fsS -D "$root_headers" -o /dev/null "$DOCS_ORIGIN/"
          grep -Fqi "x-relay-docs-proxy: cloudflare-production" "$root_headers"

      - name: Record what was published
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          {
            echo "## Published"
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Site: $DOCS_ORIGIN"
            echo "- Worker: \`$PRODUCTION_WORKER\`"
            echo "- Mintlify status ID: \`${MINTLIFY_STATUS_ID:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
