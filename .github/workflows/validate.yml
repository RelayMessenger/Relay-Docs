name: Validate docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Links, build, and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check docs.json is valid JSON
        run: python3 -m json.tool docs.json > /dev/null

      - name: Lint the OpenAPI spec
        run: npx --yes @redocly/cli@latest lint api-reference/openapi.yaml

      - name: Check for broken links
        run: npx --yes mint@latest broken-links

      - name: Validate the build
        run: npx --yes mint@latest validate

      - name: Check every icon name exists in Lucide
        run: |
          set -euo pipefail
          # docs.json sets icons.library to lucide, so a Font Awesome name
          # renders nothing at all rather than failing the build.
          npm pack lucide-static@latest --silent > /dev/null
          tar -tzf lucide-static-*.tgz \
            | grep '^package/icons/.*\.svg$' \
            | sed 's|package/icons/||; s|\.svg$||' \
            | sort > /tmp/lucide-names.txt
          echo "Lucide exports $(wc -l < /tmp/lucide-names.txt) icons."

          { grep -rhoE 'icon="[^"]+"' --include='*.mdx' . || true; } \
            | sed 's/icon="//; s/"//' > /tmp/used.txt
          { grep -oE '"icon": "[^"]+"' docs.json || true; } \
            | sed 's/"icon": "//; s/"//' >> /tmp/used.txt

          missing=0
          while read -r icon; do
            [ -z "$icon" ] && continue
            case "$icon" in
              /*)
                # File-path icon: valid if the file exists in the repo.
                if [ ! -f ".$icon" ]; then
                  echo "::error::Icon file '$icon' does not exist in the repo."
                  missing=1
                fi
                continue ;;
              http*) continue ;;
            esac
            if ! grep -qx "$icon" /tmp/lucide-names.txt; then
              echo "::error::Icon '$icon' is not a Lucide icon and will render as blank."
              missing=1
            fi
          done < <(sort -u /tmp/used.txt)

          rm -f lucide-static-*.tgz
          [ "$missing" -eq 0 ] && echo "All icon names are valid Lucide icons."
          exit "$missing"

      - name: Block internal references and placeholders
        run: |
          set -euo pipefail
          # This repository is public. Nothing internal may land in it.
          if grep -rnE 'PRODUCT\.md|/tmp/|research/|source-archive|TECHNICAL-SHEET|companion-inc|TODO:' \
               --include='*.mdx' --include='*.md' --include='*.json' --include='*.yaml' \
               --exclude-dir=.github . ; then
            echo "::error::Found an internal reference or TODO placeholder in published content."
            exit 1
          fi
          echo "No internal references or placeholders found."
