name: Validate docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Links, build, and OpenAPI
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check docs.json is valid JSON
        run: python3 -m json.tool docs.json > /dev/null

      - name: Check minimal docs contract
        run: python3 scripts/validate-docs.py

      # Every snippet on a cookbook-backed integration page must be real code
      # from the Relay-SDK recipe it documents, at the branch the page links
      # (scripts/origins.py source_ref(): staging here, main once the target
      # is production). Cloned outside the workspace so the link, build and
      # internal-reference checks below never scan SDK files.
      - name: Cookbook snippets match the Relay-SDK recipes
        run: |
          set -euo pipefail
          ref="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from origins import source_ref; print(source_ref())')"
          sdk="$RUNNER_TEMP/relay-sdk"
          git clone --quiet --depth 1 --branch "$ref" https://github.com/RelayMessenger/Relay-SDK.git "$sdk"
          echo "Relay-SDK $ref at $(git -C "$sdk" rev-parse HEAD)"
          RELAY_SDK_DIR="$sdk" python3 scripts/test-cookbook-snippets.py -v 2>&1 | tee "$RUNNER_TEMP/snippets.log"
          # A skipped run would pass silently; this check must have run.
          if grep -q "skipped" "$RUNNER_TEMP/snippets.log"; then
            echo "::error::The cookbook snippet check was skipped."
            exit 1
          fi

      - name: Check payment fee documentation
        run: python3 scripts/test-payment-fee.py

      - name: Check private pageviews and environment-safe analytics promotion
        run: npm run check:posthog

      - name: Promotion workflow pushes main itself, after the guards
        run: python3 scripts/test-promote-workflow.py

      - name: Lint the OpenAPI spec
        run: npx --yes @redocly/cli@latest lint api-reference/openapi.yaml

      - name: Check the Mintlify OpenAPI bundle
        run: |
          cp api-reference/openapi.mint.yaml /tmp/openapi.mint.yaml
          scripts/build-mint-openapi.sh
          diff -q /tmp/openapi.mint.yaml api-reference/openapi.mint.yaml

      # Pin the CLI version exercised by the local dependency-upgrade gates.
      - name: Check for broken links
        run: npx --yes mint@4.2.992 broken-links

      - name: Validate the build
        run: npx --yes mint@4.2.992 validate

      - name: Check every icon renders on Mintlify's icon CDN
        run: |
          set -euo pipefail
          # Mintlify renders lucide icons as CSS masks fetched from its CDN,
          # pinned to a specific Lucide version. A name missing there renders
          # blank even if newer Lucide releases have it, so validate against
          # the CDN itself, not an npm package.
          CDN="https://d3gk2c5xim1je2.cloudfront.net/lucide/v1.16.0"

          { grep -rhoE 'icon="[^"]+"' --include='*.mdx' . || true; } \
            | sed 's/icon="//; s/"//' > /tmp/used.txt
          { grep -oE '"icon": "[^"]+"' docs.json || true; } \
            | sed 's/"icon": "//; s/"//' >> /tmp/used.txt

          missing=0
          while read -r icon; do
            [ -z "$icon" ] && continue
            case "$icon" in
              /*)
                # File-path icon: valid if the file exists in the repo.
                if [ ! -f ".$icon" ]; then
                  echo "::error::Icon file '$icon' does not exist in the repo."
                  missing=1
                fi
                continue ;;
              http*) continue ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' "$CDN/$icon.svg")
            if [ "$code" != "200" ]; then
              echo "::error::Icon '$icon' returns $code from Mintlify's icon CDN and will render as blank."
              missing=1
            fi
          done < <(sort -u /tmp/used.txt)

          [ "$missing" -eq 0 ] && echo "All icon names resolve on the icon CDN."
          exit "$missing"

      - name: Skill copies must not drift
        run: |
          # Root skill.md overrides Mintlify's generated /skill.md; the
          # .mintlify copy feeds agent-skills discovery. They must stay
          # byte-identical (a symlink is not followed by the deploy).
          diff -q skill.md .mintlify/skills/relay/SKILL.md

      - name: Block internal references and placeholders
        run: |
          set -euo pipefail
          # This repository is public. Nothing internal may land in it.
          if grep -rnE 'PRODUCT\.md|/tmp/|research/|source-archive|TECHNICAL-SHEET|companion-inc|TODO:' \
               --include='*.mdx' --include='*.md' --include='*.json' --include='*.yaml' \
               --exclude-dir=.github . ; then
            echo "::error::Found an internal reference or TODO placeholder in published content."
            exit 1
          fi
          echo "No internal references or placeholders found."
